<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>数あて | Shelfiria</title>
<meta name="description" content="シェルフィリアの小さな遊び場。1から100の数字を当てるゲーム。大きい小さいのヒントと範囲ゲージつき。">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#131847"><meta property="og:type" content="website"><meta property="og:site_name" content="シェルフィリア"><meta property="og:image" content="https://paper-daemon.github.io/og-amase.png"><meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/site.css?v=20261101-1">
<style>.guess-stage{max-width:520px;margin:0 auto;text-align:center;background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 var(--ink);padding:30px 22px 32px;position:relative;overflow:hidden}
.guess-stage:before{content:"";position:absolute;top:0;left:0;right:0;height:8px;background:linear-gradient(90deg,#2b50c8,#6ee7ff)}
.gauge{height:22px;border:2px solid var(--ink);border-radius:999px;position:relative;background:#fff;margin:20px 0 6px}
.gauge .lo,.gauge .hi{position:absolute;top:0;bottom:0;background:rgba(43,80,200,.22)}
.gauge .cur{position:absolute;top:-6px;width:4px;height:30px;background:#d23b2a;border-radius:2px}
input[type=number]{font:700 1.4rem var(--mono);width:130px;padding:10px;border:2px solid var(--ink);border-radius:12px;text-align:center}
.hint{font-weight:900;font-size:1.25rem;min-height:1.6em;margin:14px 0 4px}
.sub{color:var(--muted);font-size:.85rem;min-height:1.5em}
.diff-btns{display:flex;gap:8px;justify-content:center;margin:6px 0 2px;flex-wrap:wrap}
.diff-btns button{font:700 .82rem var(--disp);padding:7px 14px;border:2px solid var(--ink);border-radius:999px;background:#fff;cursor:pointer}
.diff-btns button.on{background:var(--ink);color:#fff}
.temp{font-weight:900;font-size:1.05rem;min-height:1.5em;margin:2px 0}
.hist{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px;min-height:26px}
.chip{font:700 .78rem var(--mono);padding:3px 9px;border-radius:999px;border:2px solid var(--ink)}
.chip.up{background:#dbe7ff}.chip.down{background:#ffe1d6}.chip.hit{background:#ffe066}
</style>
</head>
<body>
<header class="site-head"><a class="brand" href="/"><img class="brand-avatar" src="https://assets.st-note.com/production/uploads/images/330115961/profile_af83ab87ce408fb4fa41f8190406f1bf.png?width=400" alt=""><span class="brand-copy"><strong>シェルフィリア</strong><small>SHELFIRIA</small></span></a><nav aria-label="main"><a href="/demo.html" aria-current="page">あそぶ</a><a href="/showcase.html">みる</a><a href="/notes/">よむ</a><a href="/work.html">おまけ</a></nav><div class="head-actions"><a class="social-mini" href="https://www.threads.com/@ive.amase" aria-label="Threads">Th</a><a class="social-mini" href="https://www.instagram.com/ive.amase/" aria-label="Instagram">IG</a><a class="head-cta" href="/demo.html">あそぶ →</a></div></header>
<main class="page">
<section class="page-hero" style="border-bottom:none;padding-bottom:10px"><p class="eyebrow">PLAY — GUESS</p><h1>数あて</h1><p class="page-lead">あませが思い浮かべた数字を当てるゲーム。ヒントは「より大きい／より小さい」に加えて、近さで変わる“温度”。難易度は 50／100／500 から選べます。</p></section>
<section class="section" style="border-bottom:none;padding-top:16px">
<div class="guess-stage">
<div class="diff-btns" role="group" aria-label="難易度">
<button type="button" data-max="50">かんたん 1〜50</button>
<button type="button" data-max="100" class="on">ふつう 1〜100</button>
<button type="button" data-max="500">むずかしい 1〜500</button>
</div>
<p style="font-weight:700" id="introLine">あませが 1〜100 の数字を1つ思い浮かべました。当ててみて。</p>
<div class="gauge"><div class="lo" id="gLo" style="left:0;width:0"></div><div class="hi" id="gHi" style="right:0;width:0"></div><div class="cur" id="gCur" style="left:50%" hidden></div></div>
<p class="sub" id="rangeLabel">範囲：1 〜 100</p>
<p class="hint" id="hint">数字を入れて「当てる」</p>
<p class="temp" id="temp"></p>
<p class="sub" id="tries">試行 0 回 ｜ ベスト <span id="best">-</span> 回</p>
<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
<input type="number" id="num" min="1" max="100" inputmode="numeric" placeholder="1-100">
<button class="button primary" id="goBtn" type="button">当てる</button>
<button class="button soft" id="resetBtn" type="button">新しい数字</button>
</div>
<div class="hist" id="hist" aria-label="これまでの予想"></div></div>
</section>
</main>
<footer class="site-footer"><div class="footer-brand"><img src="https://assets.st-note.com/production/uploads/images/330115961/profile_af83ab87ce408fb4fa41f8190406f1bf.png?width=400" alt=""><span><strong>シェルフィリア</strong><br>SHELFIRIA</span></div><nav><a href="/">トップ</a><a href="/demo.html" aria-current="page">あそぶ</a><a href="/showcase.html">みる</a><a href="/notes/">よむ</a><a href="/work.html">おまけ</a><a href="https://www.threads.com/@ive.amase">Threads</a><a href="https://www.instagram.com/ive.amase/">Instagram</a><a href="https://x.com/amase__iv">X</a><a href="https://github.com/paper-daemon">GitHub</a><a href="https://amase-lab.booth.pm/">BOOTH</a></nav></footer>
<script>let AC=null;function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d,type,v,when){const ac=audio();if(!ac)return;const t=ac.currentTime+(when||0);const o=ac.createOscillator(),g=ac.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(v||0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+0.02)}
let maxN=100,target=1+Math.floor(Math.random()*100),lo=1,hi=100,tries=0,done=false;
const hint=document.getElementById("hint"),tempEl=document.getElementById("temp"),triesEl=document.getElementById("tries"),num=document.getElementById("num"),rangeLabel=document.getElementById("rangeLabel"),gLo=document.getElementById("gLo"),gHi=document.getElementById("gHi"),gCur=document.getElementById("gCur"),hist=document.getElementById("hist"),introLine=document.getElementById("introLine");
function bestKey(){return "guessBest"+maxN}
function getBest(){return Number(localStorage.getItem(bestKey())||0)}
function paint(){const span=maxN-1;gLo.style.width=((lo-1)/span*100)+"%";gHi.style.width=((maxN-hi)/span*100)+"%";rangeLabel.textContent="範囲："+lo+" 〜 "+hi;const b=getBest();triesEl.innerHTML="試行 "+tries+" 回 ｜ ベスト "+(b>0?b:"-")+" 回（"+(maxN===50?"かんたん":maxN===100?"ふつう":"むずかしい")+"）"}
function tempOf(v){const r=Math.abs(v-target)/maxN;
if(r<=0.02)return["激アツ！","#d23b2a",880];
if(r<=0.06)return["あつい","#e06a1b",660];
if(r<=0.15)return["ぬるい","#b78a1e",520];
if(r<=0.35)return["つめたい","#2b6fc8",392];
return["極寒…","#274b9f",330];}
function reset(){target=1+Math.floor(Math.random()*maxN);lo=1;hi=maxN;tries=0;done=false;hint.textContent="新しい数字にしました";tempEl.textContent="";gCur.hidden=true;hist.innerHTML="";introLine.textContent="あませが 1〜"+maxN+" の数字を1つ思い浮かべました。当ててみて。";num.max=maxN;num.placeholder="1-"+maxN;paint();num.value="";num.focus()}
document.getElementById("resetBtn").addEventListener("click",reset);
document.querySelectorAll(".diff-btns button").forEach(b=>{b.addEventListener("click",()=>{document.querySelectorAll(".diff-btns button").forEach(x=>x.classList.remove("on"));b.classList.add("on");maxN=Number(b.dataset.max);reset();})});
function addChip(v,kind){const s=document.createElement("span");s.className="chip "+kind;s.textContent=v+(kind==="up"?" ↑":kind==="down"?" ↓":" ◎");hist.appendChild(s)}
function rank(){const opt=Math.ceil(Math.log2(maxN+1));if(tries<=opt)return"S（読み切り！）";if(tries<=opt+2)return"A";if(tries<=opt+5)return"B";return"C";}
function guess(){
if(done)return;const v=Number(num.value);
if(!v||v<1||v>maxN){hint.textContent="1〜"+maxN+"で入れてね";return}
tries++;gCur.hidden=false;gCur.style.left="calc("+((v-1)/(maxN-1)*100)+"% - 2px)";
if(v===target){done=true;addChip(v,"hit");const tp=tempOf(v);hint.textContent="正解！ "+target+" でした（"+tries+"回） ランク "+rank();tempEl.textContent="";tone(784,0.12,"sine",0.12);tone(1047,0.2,"sine",0.12,0.1);
const b=getBest();if(!b||tries<b){localStorage.setItem(bestKey(),tries);hint.textContent+=" ベスト更新！"}
}else{const tp=tempOf(v);tempEl.textContent=tp[0];tempEl.style.color=tp[1];
if(v<target){lo=Math.max(lo,v+1);hint.textContent=v+" より大きい";addChip(v,"up")}else{hi=Math.min(hi,v-1);hint.textContent=v+" より小さい";addChip(v,"down")}
tone(tp[2],0.09,"triangle",0.1)}
paint();num.select();
}
document.getElementById("goBtn").addEventListener("click",guess);
num.addEventListener("keydown",e=>{if(e.key==="Enter")guess()});
paint();</script>
<script src="/ad-overlay.js" defer></script>
</body></html>
