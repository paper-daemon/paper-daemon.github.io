<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const wrap = document.getElementById('stage3d');
const loading = document.getElementById('gl-loading');

function canvasTex(w, h, draw){
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const makeBackdrop = () => canvasTex(1024, 640, (g, w, h) => {
  const base = g.createLinearGradient(0, 0, 0, h);
  base.addColorStop(0, '#fff9ee'); base.addColorStop(.6, '#ffeedd'); base.addColorStop(1, '#f8dcc2');
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  const blob = (x, y, r, col) => { const rg = g.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = rg; g.fillRect(x - r, y - r, r * 2, r * 2); };
  blob(240, 150, 210, 'rgba(255,255,255,.95)'); blob(700, 130, 260, 'rgba(150,205,255,.50)');
  blob(850, 420, 300, 'rgba(255,170,205,.48)'); blob(180, 470, 260, 'rgba(255,205,110,.52)');
  blob(520, 330, 240, 'rgba(190,165,255,.40)'); blob(430, 90, 150, 'rgba(160,240,215,.45)');
});
const makeSandTex = () => canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#e9bcc8'; g.fillRect(0, 0, w, h);
  let s = 11; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const cols = ['#f2a7c3', '#fbd98a', '#8ecfeb', '#f5b183', '#cf9fe8', '#ffffff', '#ffd76e', '#f6c9da', '#ffe9c9'];
  // uneven color fields, like mixed sand poured in and settled
  for (let i = 0; i < 46; i++){
    const x = rnd() * w, y = rnd() * h, r = 40 + rnd() * 110, col = cols[(rnd() * cols.length) | 0];
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, col + '2e'); rg.addColorStop(1, col + '00');
    g.fillStyle = rg; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // packed grains at readable scale: shadow, body, glint
  for (let i = 0; i < 5200; i++){
    const x = rnd() * w, y = rnd() * h, r = 2.6 + rnd() * 3.8, col = cols[(rnd() * cols.length) | 0];
    g.fillStyle = 'rgba(110,60,75,.4)'; g.beginPath(); g.arc(x, y + r * .38, r * .92, 0, 6.29); g.fill();
    g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, 6.29); g.fill();
    if (rnd() < .34){ g.fillStyle = 'rgba(255,255,255,.8)'; g.beginPath(); g.arc(x - r * .28, y - r * .32, r * .34, 0, 6.29); g.fill(); }
  }
  // fine filler between the grains
  for (let i = 0; i < 5000; i++){
    g.fillStyle = rnd() < .5 ? 'rgba(255,255,255,.35)' : 'rgba(120,70,80,.28)';
    g.fillRect(rnd() * w, rnd() * h, 1.6, 1.6);
  }
  // depth: slightly darker toward the bottom of the bottle
  const grad = g.createLinearGradient(0, h, 0, 0);
  grad.addColorStop(0, 'rgba(90,45,60,.22)'); grad.addColorStop(.45, 'rgba(90,45,60,0)');
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
});
const makeCork = () => canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#d9a05e'; g.fillRect(0, 0, w, h);
  let s = 23; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 260; i++){ g.fillStyle = `rgba(122,72,26,${.12 + rnd() * .3})`; g.beginPath(); g.ellipse(rnd() * w, rnd() * h, 1 + rnd() * 3.4, .8 + rnd() * 1.8, rnd() * 3, 0, 6.29); g.fill(); }
  for (let i = 0; i < 26; i++){ g.fillStyle = `rgba(255,230,180,${.10 + rnd() * .16})`; g.fillRect(rnd() * w, 0, 1.4, h); }
});
const makeLabel = () => canvasTex(512, 256, (g, w, h) => {
  g.fillStyle = '#fffbee'; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(150,110,60,.65)'; g.lineWidth = 5; g.strokeRect(14, 14, w - 28, h - 28);
  g.fillStyle = '#7a4b21'; g.font = '700 92px "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('ほしくず', w / 2, h / 2 - 18);
  g.fillStyle = '#e8a13a'; const x = w / 2, y = h - 52, r = 17;
  g.beginPath();
  for (let k = 0; k < 10; k++){ const rr = k % 2 ? r * .45 : r, a = k * Math.PI / 5 - Math.PI / 2; const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr; k ? g.lineTo(px, py) : g.moveTo(px, py); }
  g.closePath(); g.fill();
});

// bottle inner radius by height (lathe local y)
const innerR = y => y < 96 ? 56 : y < 118 ? 56 - (y - 96) * .9 : y < 134 ? 36 - (y - 118) * 1.1 : 17;
const FILL_Y = 76; // sand fill level in bottle local coords

function init(){
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.06;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.domElement.style.touchAction = 'none';
  renderer.domElement.style.cursor = 'grab';
  wrap.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
  scene.environmentIntensity = .8;

  const camera = new THREE.PerspectiveCamera(34, 1, 1, 4000);
  camera.position.set(0, 118, 660); camera.lookAt(0, 96, 0);

  const key = new THREE.DirectionalLight(0xffffff, 2.4);
  key.position.set(150, 320, 230); key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.left = -170; key.shadow.camera.right = 170;
  key.shadow.camera.top = 240; key.shadow.camera.bottom = -60;
  key.shadow.camera.near = 60; key.shadow.camera.far = 1000;
  key.shadow.bias = -0.0004; key.shadow.radius = 6;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xbfd9ff, 1.2); rim.position.set(-240, 150, -180); scene.add(rim);
  scene.add(new THREE.AmbientLight(0xfff1de, .35));

  const backdrop = new THREE.Mesh(new THREE.PlaneGeometry(1700, 1060), new THREE.MeshBasicMaterial({ map: makeBackdrop() }));
  backdrop.position.set(0, 230, -360); scene.add(backdrop);
  const floorShadow = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.ShadowMaterial({ opacity: .22 }));
  floorShadow.rotation.x = -Math.PI / 2; floorShadow.receiveShadow = true; scene.add(floorShadow);

  // ---- bottle ----
  const tilt = new THREE.Group(); tilt.position.y = 10; scene.add(tilt);
  const body = new THREE.Group(); body.position.y = -10; tilt.add(body);
  const profile = [[0,0],[38,0],[55,3],[61,14],[62,40],[62,84],[59,104],[48,120],[30,131],[22,137],[21,142],[21,164],[26,164],[26,174],[20,174],[20,158]]
    .map(p => new THREE.Vector2(p[0], p[1]));
  const glass = new THREE.Mesh(new THREE.LatheGeometry(profile, 96), new THREE.MeshPhysicalMaterial({
    color: 0xffffff, metalness: 0, roughness: .055,
    transmission: 1, thickness: 13, ior: 1.52, dispersion: 3,
    iridescence: .5, iridescenceIOR: 1.3,
    attenuationColor: new THREE.Color(0xd8f2f0), attenuationDistance: 190,
    clearcoat: .55, clearcoatRoughness: .28, envMapIntensity: 1.25, specularIntensity: 1.1
  }));
  glass.castShadow = true; body.add(glass);
  const cork = new THREE.Mesh(new THREE.CylinderGeometry(19.5, 21.5, 36, 48),
    new THREE.MeshStandardMaterial({ map: makeCork(), roughness: .88 }));
  cork.position.y = 178; cork.castShadow = true; body.add(cork);
  const label = new THREE.Mesh(
    new THREE.CylinderGeometry(62.9, 62.9, 26, 48, 1, true, -0.78, 1.56),
    new THREE.MeshStandardMaterial({ map: makeLabel(), roughness: .85, side: THREE.DoubleSide }));
  label.position.y = 44; body.add(label);

  // ---- sand column (child of bottle; its top surface stays world-level) ----
  const sandTex = makeSandTex();
  const SEG = 64;
  const rings = [ { y: 2, r: 44 }, { y: 26, r: 52 }, { y: 52, r: 54 }, { y: FILL_Y, r: 54 } ];
  const colPos = [], colUv = [], colIdx = [];
  rings.forEach((ring, ri) => {
    for (let s = 0; s <= SEG; s++){
      const a = s / SEG * Math.PI * 2;
      colPos.push(Math.cos(a) * ring.r, ring.y, Math.sin(a) * ring.r);
      colUv.push(s / SEG * 3, ri / (rings.length - 1));
    }
  });
  for (let ri = 0; ri < rings.length - 1; ri++){
    for (let s = 0; s < SEG; s++){
      const a = ri * (SEG + 1) + s, b = a + SEG + 1;
      colIdx.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  const colGeo = new THREE.BufferGeometry();
  colGeo.setAttribute('position', new THREE.Float32BufferAttribute(colPos, 3));
  colGeo.setAttribute('uv', new THREE.Float32BufferAttribute(colUv, 2));
  colGeo.setIndex(colIdx); colGeo.computeVertexNormals();
  const column = new THREE.Mesh(colGeo, new THREE.MeshStandardMaterial({ map: sandTex, bumpMap: sandTex, bumpScale: 1.4, roughness: .92 }));
  body.add(column);
  // surface fan (center + top ring), positions updated per-frame
  const surfPos = [0, FILL_Y, 0], surfUv = [.5, .5], surfIdx = [];
  for (let s = 0; s <= SEG; s++){
    const a = s / SEG * Math.PI * 2, x = Math.cos(a) * 54, z = Math.sin(a) * 54;
    surfPos.push(x, FILL_Y, z); surfUv.push(x / 110, z / 110);
    if (s < SEG) surfIdx.push(0, s + 2, s + 1);
  }
  const surfGeo = new THREE.BufferGeometry();
  surfGeo.setAttribute('position', new THREE.Float32BufferAttribute(surfPos, 3));
  surfGeo.setAttribute('uv', new THREE.Float32BufferAttribute(surfUv, 2));
  surfGeo.setIndex(surfIdx); surfGeo.computeVertexNormals();
  const surface = new THREE.Mesh(surfGeo, new THREE.MeshStandardMaterial({ map: sandTex, bumpMap: sandTex, bumpScale: 1.4, roughness: .92 }));
  body.add(surface);
  const colTopStart = (rings.length - 1) * (SEG + 1); // first vertex of top ring in column geometry

  // ---- particles (grains + stars), simulated in WORLD frame ----
  let seed = 5; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const NG = 520, NS = 40, N = NG + NS;
  const P = [];
  for (let i = 0; i < N; i++){
    const star = i >= NG;
    const a = rnd() * 6.283, rr = Math.sqrt(rnd()) * 42;
    P.push({
      star, r: star ? 3.4 : 1.1 + rnd() * 1.9, rx: 0, rz: 0, asleep: 0,
      x: Math.cos(a) * rr, z: Math.sin(a) * rr * .8, y: 0,
      vx: 0, vy: 0, vz: 0, rot: rnd() * 6.28
    });
    P[i].y = FILL_Y + 6 + P[i].r + rnd() * (star ? 26 : 12);
  }
  const grainMesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1),
    new THREE.MeshPhysicalMaterial({ roughness: .32, metalness: .05, clearcoat: .55, clearcoatRoughness: .45, envMapIntensity: 1.25, flatShading: true }), NG);
  const palette = ['#f2a7c3', '#fbd98a', '#8ecfeb', '#f5b183', '#cf9fe8', '#ffffff', '#ffd76e'].map(h => new THREE.Color(h));
  for (let i = 0; i < NG; i++){ const cc = palette[i % palette.length].clone();
    cc.offsetHSL((rnd() - .5) * .02, (rnd() - .5) * .08, (rnd() - .5) * .09); grainMesh.setColorAt(i, cc); }
  grainMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); body.add(grainMesh);
  const starShape = new THREE.Shape();
  for (let k = 0; k < 10; k++){ const rr = k % 2 ? 4.2 : 9.5, a = k * Math.PI / 5 - Math.PI / 2; const px = Math.cos(a) * rr, py = Math.sin(a) * rr; k ? starShape.lineTo(px, py) : starShape.moveTo(px, py); }
  starShape.closePath();
  const starMesh = new THREE.InstancedMesh(
    new THREE.ExtrudeGeometry(starShape, { depth: 3, bevelEnabled: true, bevelSize: 1, bevelThickness: 1 }),
    new THREE.MeshPhysicalMaterial({ metalness: .3, roughness: .42, envMapIntensity: 1.1 }), NS);
  const starCols = ['#fff3d6', '#ffe9a8', '#fff8ec', '#ffd9e8', '#f6e3b8', '#ffffff'].map(h => new THREE.Color(h));
  for (let i = 0; i < NS; i++) starMesh.setColorAt(i, starCols[i % starCols.length]);
  starMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); body.add(starMesh);

  // interaction
  let angZ = 0, angX = 0, velZ = 0, velX = 0, tgtZ = 0, tgtX = .02;
  let dragging = false, lastX = 0, lastY = 0, lastInteract = 0, interacted = false;
  const el = renderer.domElement;
  el.addEventListener('pointerdown', e => { dragging = true; interacted = true; lastX = e.clientX; lastY = e.clientY; lastInteract = performance.now(); el.setPointerCapture(e.pointerId); el.style.cursor = 'grabbing'; });
  el.addEventListener('pointermove', e => {
    if (!dragging) return;
    tgtZ = THREE.MathUtils.clamp(tgtZ - (e.clientX - lastX) * .005, -.58, .58);
    tgtX = THREE.MathUtils.clamp(tgtX + (e.clientY - lastY) * .003, -.12, .42);
    lastX = e.clientX; lastY = e.clientY; lastInteract = performance.now();
  });
  const end = () => { dragging = false; el.style.cursor = 'grab'; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);

  function resize(){
    const w = wrap.clientWidth, h = wrap.clientHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    const dist = camera.aspect >= 1 ? 560 : 560 / Math.pow(camera.aspect, 0.85);
    camera.position.set(0, 118, dist);
    camera.lookAt(0, 96, 0);
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(wrap); resize();

  // sand surface in BOTTLE frame: world-level plane + a pile toward the low side.
  // One function shared by the column mesh, the surface fan and every particle.
  let plNx = 0, plNy = 1, plNz = 0, plD = FILL_Y, pileX = 0, pileZ = 0, pileAmt = 0;
  const surfY = (x, z) => {
    let y = (plD - plNx * x - plNz * z) / plNy;
    if (pileAmt > .1){
      const dx = x - pileX * 20, dz = z - pileZ * 20;
      y += pileAmt * Math.exp(-(dx * dx + dz * dz) / 480);
    }
    return THREE.MathUtils.clamp(y, 30, 104);
  };
  const gB = new THREE.Vector3();

  // slosh state: extra tilt of the sand plane (world frame), spring-driven
  let slX = 0, slZ = 0, slVX = 0, slVZ = 0;
  const dummy = new THREE.Object3D();
  const v = new THREE.Vector3(), nB = new THREE.Vector3(), nW = new THREE.Vector3(), anchorW = new THREE.Vector3();
  const qBodyInv = new THREE.Quaternion();
  const t0 = performance.now();
  let prevNow = performance.now(), first = true;

  renderer.setAnimationLoop(() => {
    const now = performance.now();
    const t = now / 1000, elapsed = (now - t0) / 1000;
    const dt = Math.min(.033, Math.max(.001, (now - prevNow) / 1000)); prevNow = now;
    const step = dt * 60; // normalize per-frame coefficients to 60fps units

    if (!interacted && elapsed < 9){
      if (elapsed < 2) tgtZ = .5 * (elapsed / 2);
      else if (elapsed < 3) tgtZ = .5;
      else if (elapsed < 5.2) tgtZ = .5 - (elapsed - 3) / 2.2;
      else if (elapsed < 6.4) tgtZ = -.5 + (elapsed - 5.2) / 1.2 * .5;
      else if (elapsed < 7.6) tgtZ = Math.sin(elapsed * 20) * .1;
      else tgtZ = Math.sin(t * .55) * .05;
      tgtX = .03;
    } else if (!dragging && now - lastInteract > 1600){
      tgtZ = Math.sin(t * .55) * .07; tgtX = .03 + Math.sin(t * .42) * .02;
    }
    const prevVelZ = velZ, prevVelX = velX;
    velZ += (tgtZ - angZ) * .05 * step; velZ *= Math.pow(.90, step); angZ += velZ * step;
    velX += (tgtX - angX) * .05 * step; velX *= Math.pow(.90, step); angX += velX * step;
    tilt.rotation.z = angZ; tilt.rotation.x = angX; tilt.rotation.y = angZ * .35;
    scene.environmentRotation.y = Math.sin(t * .25) * .25;

    // slosh: plane tilt chases bottle angular velocity (inertia), springs back to level
    const accZ = (velZ - prevVelZ) / Math.max(dt, .001), accX = (velX - prevVelX) / Math.max(dt, .001);
    slVZ += (THREE.MathUtils.clamp(accZ * .05, -.25, .25) - slZ * 42 - slVZ * 9) * dt;
    slVX += (THREE.MathUtils.clamp(accX * .05, -.25, .25) - slX * 42 - slVX * 9) * dt;
    slZ += slVZ * dt; slX += slVX * dt;

    tilt.updateMatrixWorld(true);
    // sand plane: normal in world = up tilted by slosh; anchor = bottle fill point in world
    nW.set(slZ, 1, -slX).normalize();
    anchorW.set(0, FILL_Y, 0); body.localToWorld(anchorW);
    // same plane in bottle frame, for the column/surface vertices
    body.getWorldQuaternion(qBodyInv).invert();
    nB.copy(nW).applyQuaternion(qBodyInv);
    const dB = nB.x * 0 + nB.y * FILL_Y + nB.z * 0;
    plNx = nB.x; plNy = nB.y; plNz = nB.z; plD = dB;
    gB.set(0, -300, 0).applyQuaternion(qBodyInv);
    { const gh = Math.hypot(gB.x, gB.z);
      if (gh > 4){ pileX = gB.x / gh; pileZ = gB.z / gh; }
      pileAmt = THREE.MathUtils.clamp(gh / 300, 0, 1) * 6; }
    const colAttr = colGeo.attributes.position, surfAttr = surfGeo.attributes.position;
    for (let s = 0; s <= SEG; s++){
      const x = colAttr.getX(colTopStart + s), z = colAttr.getZ(colTopStart + s);
      const y = surfY(x, z) + (((s * 37) % 11) - 5) * .22;
      colAttr.setY(colTopStart + s, y);
      surfAttr.setY(s + 1, y);
    }
    surfAttr.setY(0, surfY(0, 0));
    colAttr.needsUpdate = true; surfAttr.needsUpdate = true;
    colGeo.computeVertexNormals(); surfGeo.computeVertexNormals();

    // particles — simulated in the BOTTLE frame: gravity rotates inside the
    // bottle as it tilts, so grains slide down the surface slope, stars roll,
    // and shaking flings them with the bottle's own angular motion.
    const shake = Math.min(2.2, Math.abs(velZ) * 26 * step + Math.abs(velX) * 20 * step);
    const omZ = velZ * 60, omX = velX * 60;              // angular velocity, rad/s
    for (let i = 0; i < N; i++){
      const p = P[i];
      const fy = surfY(p.x, p.z) + p.r;
      const onFloor = p.y <= fy + .6;
      // tangential gravity along the surface (decides hold vs avalanche)
      const gdn = gB.x * plNx + gB.y * plNy + gB.z * plNz;
      const gtx = gB.x - plNx * gdn, gtz = gB.z - plNz * gdn;
      const gtMag = Math.hypot(gtx, gtz);
      if (p.asleep > 4 && shake < .35 && gtMag < 170){
        // resting: keep the containment clamp, skip integration
        const rad0 = Math.hypot(p.x, p.z), maxR0 = innerR(p.y) - p.r - 1;
        if (rad0 > maxR0){ const s = maxR0 / rad0; p.x *= s; p.z *= s; }
        continue;
      }
      p.asleep = 0;
      // gravity (bottle frame) + Euler & centrifugal terms from the bottle's swing
      let ax = gB.x, ay = gB.y, az = gB.z;
      const rx = p.x, ry = p.y - 10, rz = p.z;
      ax += (-accZ * ry) * .55 + (-(omZ * omZ) * rx - omZ * omX * rz) * .5;
      ay += (accZ * rx - accX * rz) * .55 + (-(omX * omX + omZ * omZ) * ry) * .5;
      az += (accX * ry) * .55 + (-(omX * omX) * rz - omX * omZ * rx) * .5;
      p.vx += ax * dt; p.vy += ay * dt; p.vz += az * dt;
      if (shake > .3){
        p.vx += (rnd() - .5) * shake * 150 * dt;
        p.vy += rnd() * shake * 110 * dt;
        p.vz += (rnd() - .5) * shake * 110 * dt;
      }
      p.vx *= .992; p.vy *= .995; p.vz *= .992;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      if (p.y < fy){
        p.y = fy;
        if (p.vy < 0) p.vy = -p.vy * (p.star ? .22 : .08);
        if (gtMag > 170){ p.vx += gtx * dt * .85; p.vz += gtz * dt * .85; p.vx *= .93; p.vz *= .93; }
        else { p.vx *= .68; p.vz *= .68; }
      }
      // containment in bottle (lathe) frame — native here; every frame, no exceptions
      const rad = Math.hypot(p.x, p.z), maxR = innerR(p.y) - p.r - 1;
      if (rad > maxR){ const s = maxR / Math.max(rad, .001); p.x *= s; p.z *= s; p.vx *= .45; p.vy *= .45; p.vz *= .45; }
      if (p.y > 128){ p.y = 128; p.vy *= .45; }
      if (p.y < 3){ p.y = 3; p.vy *= .45; }
      // rest bookkeeping + rolling
      const spd = Math.abs(p.vx) + Math.abs(p.vy) + Math.abs(p.vz);
      if (onFloor && spd < 7 && gtMag < 170) p.asleep++; else if (spd >= 7) p.asleep = 0;
      p.rx += p.vz * dt * (p.star ? 1.1 : .3);
      p.rz -= p.vx * dt * (p.star ? 1.1 : .3);
      p.rot += p.vx * .1 * dt;
    }
    for (let i = 0; i < NG; i++){
      const p = P[i];
      dummy.position.set(p.x, p.y, p.z);
      dummy.scale.setScalar(p.r);
      dummy.rotation.set(0, p.rot, 0);
      dummy.updateMatrix();
      grainMesh.setMatrixAt(i, dummy.matrix);
    }
    for (let i = 0; i < NS; i++){
      const p = P[NG + i];
      dummy.position.set(p.x, p.y, p.z);
      dummy.scale.setScalar(.34);
      dummy.rotation.set(p.rx, p.rot, p.rz);
      dummy.updateMatrix();
      starMesh.setMatrixAt(i, dummy.matrix);
    }
    grainMesh.instanceMatrix.needsUpdate = true;
    starMesh.instanceMatrix.needsUpdate = true;

    renderer.render(scene, camera);
    if (first){ first = false; loading.style.display = 'none'; }
  });
}
try { init(); } catch (e) { console.error(e); loading.textContent = 'この端末では3D表示が使えませんでした。'; }
</script>
