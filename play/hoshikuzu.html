<h1>星屑の小瓶。</h1>
<p class="page-lead">星の砂が入った、小さなガラス瓶。傾けると、中の星の砂が流れます。ドラッグで傾けてみてください。開いた直後、勝手に一度ゆれます。</p>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const wrap = document.getElementById('stage3d');
const loading = document.getElementById('gl-loading');

function canvasTex(w, h, draw){
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const makeBackdrop = () => canvasTex(1024, 640, (g, w, h) => {
  const base = g.createLinearGradient(0, 0, 0, h);
  base.addColorStop(0, '#fff9ee'); base.addColorStop(.6, '#ffeedd'); base.addColorStop(1, '#f8dcc2');
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  const blob = (x, y, r, col) => { const rg = g.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = rg; g.fillRect(x - r, y - r, r * 2, r * 2); };
  blob(240, 150, 210, 'rgba(255,255,255,.95)'); blob(700, 130, 260, 'rgba(150,205,255,.50)');
  blob(850, 420, 300, 'rgba(255,170,205,.48)'); blob(180, 470, 260, 'rgba(255,205,110,.52)');
  blob(520, 330, 240, 'rgba(190,165,255,.40)'); blob(430, 90, 150, 'rgba(160,240,215,.45)');
});
const makeSandTex = () => canvasTex(512, 512, (g, w, h) => {
  const bands = ['#f6c9d8', '#fdeecb', '#bfe3f2', '#f9d9b8', '#e7c8ee', '#cdeeda', '#f6c9d8'];
  bands.forEach((col, i) => { g.fillStyle = col; g.fillRect(0, i * h / bands.length, w, h / bands.length + 2); });
  let s = 11; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 2600; i++){ g.fillStyle = `rgba(255,255,255,${.2 + rnd() * .6})`; g.fillRect(rnd() * w, rnd() * h, 1.7, 1.7); }
  for (let i = 0; i < 260; i++){ g.fillStyle = `rgba(120,80,60,${.10 + rnd() * .2})`; g.fillRect(rnd() * w, rnd() * h, 1.5, 1.5); }
});
const makeCork = () => canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#d9a05e'; g.fillRect(0, 0, w, h);
  let s = 23; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 260; i++){ g.fillStyle = `rgba(122,72,26,${.12 + rnd() * .3})`; g.beginPath(); g.ellipse(rnd() * w, rnd() * h, 1 + rnd() * 3.4, .8 + rnd() * 1.8, rnd() * 3, 0, 6.29); g.fill(); }
  for (let i = 0; i < 26; i++){ g.fillStyle = `rgba(255,230,180,${.10 + rnd() * .16})`; g.fillRect(rnd() * w, 0, 1.4, h); }
});
const makeLabel = () => canvasTex(512, 256, (g, w, h) => {
  g.fillStyle = '#fffbee'; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(150,110,60,.65)'; g.lineWidth = 5; g.strokeRect(14, 14, w - 28, h - 28);
  g.fillStyle = '#7a4b21'; g.font = '700 92px "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('ほしくず', w / 2, h / 2 - 18);
  g.fillStyle = '#e8a13a'; const x = w / 2, y = h - 52, r = 17;
  g.beginPath();
  for (let k = 0; k < 10; k++){ const rr = k % 2 ? r * .45 : r, a = k * Math.PI / 5 - Math.PI / 2; const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr; k ? g.lineTo(px, py) : g.moveTo(px, py); }
  g.closePath(); g.fill();
});

// sand surface height (contents-frame local coords)
const moundY = (x, z) => 60 + 2.0 * Math.sin(x * .045 + 1.7) * Math.cos(z * .05) + 1.4 * Math.sin(x * .11) * Math.sin(z * .09);
// bottle inner radius by height (mesh-local y)
const innerR = y => y < 96 ? 56 : y < 118 ? 56 - (y - 96) * .9 : y < 134 ? 36 - (y - 118) * 1.1 : 17;

function init(){
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.06;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.domElement.style.touchAction = 'none';
  renderer.domElement.style.cursor = 'grab';
  wrap.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
  scene.environmentIntensity = .8;

  const camera = new THREE.PerspectiveCamera(34, 1, 1, 3000);
  camera.position.set(0, 122, 452); camera.lookAt(0, 92, 0);

  const key = new THREE.DirectionalLight(0xffffff, 2.4);
  key.position.set(150, 320, 230); key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.left = -170; key.shadow.camera.right = 170;
  key.shadow.camera.top = 240; key.shadow.camera.bottom = -60;
  key.shadow.camera.near = 60; key.shadow.camera.far = 1000;
  key.shadow.bias = -0.0004; key.shadow.radius = 6;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xbfd9ff, 1.2); rim.position.set(-240, 150, -180); scene.add(rim);
  scene.add(new THREE.AmbientLight(0xfff1de, .35));

  const backdrop = new THREE.Mesh(new THREE.PlaneGeometry(1700, 1060), new THREE.MeshBasicMaterial({ map: makeBackdrop() }));
  backdrop.position.set(0, 230, -360); scene.add(backdrop);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.ShadowMaterial({ opacity: .22 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

  // ---- bottle (tilts) ----
  const tilt = new THREE.Group(); tilt.position.y = 10; scene.add(tilt);
  const body = new THREE.Group(); body.position.y = -10; tilt.add(body);
  const profile = [[0,0],[38,0],[55,3],[61,14],[62,40],[62,84],[59,104],[48,120],[30,131],[22,137],[21,142],[21,164],[26,164],[26,174],[20,174],[20,158]]
    .map(p => new THREE.Vector2(p[0], p[1]));
  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff, metalness: 0, roughness: .055,
    transmission: 1, thickness: 13, ior: 1.52, dispersion: 3,
    iridescence: .5, iridescenceIOR: 1.3,
    attenuationColor: new THREE.Color(0xd8f2f0), attenuationDistance: 190,
    clearcoat: .55, clearcoatRoughness: .28, envMapIntensity: 1.25, specularIntensity: 1.1
  });
  const glass = new THREE.Mesh(new THREE.LatheGeometry(profile, 96), glassMat);
  glass.castShadow = true; body.add(glass);
  const cork = new THREE.Mesh(new THREE.CylinderGeometry(19.5, 21.5, 36, 48),
    new THREE.MeshStandardMaterial({ map: makeCork(), roughness: .88 }));
  cork.position.y = 178; cork.castShadow = true; body.add(cork);
  const label = new THREE.Mesh(
    new THREE.CylinderGeometry(62.9, 62.9, 36, 48, 1, true, -0.78, 1.56),
    new THREE.MeshStandardMaterial({ map: makeLabel(), roughness: .85, side: THREE.DoubleSide }));
  label.position.y = 50; body.add(label);

  // ---- contents (counter-tilts with lag; simulated in this frame) ----
  const contents = new THREE.Group(); scene.add(contents);
  const sandTex = makeSandTex();
  const discGeo = new THREE.CircleGeometry(50, 48);
  { const pos = discGeo.attributes.position;
    for (let i = 0; i < pos.count; i++){ const x = pos.getX(i), y = pos.getY(i); pos.setZ(i, moundY(x, -y) - 60); }
    discGeo.computeVertexNormals(); }
  const disc = new THREE.Mesh(discGeo, new THREE.MeshStandardMaterial({ map: sandTex, roughness: .95 }));
  disc.rotation.x = -Math.PI / 2; disc.position.y = 60; contents.add(disc);
  const skirt = new THREE.Mesh(new THREE.CylinderGeometry(50, 43, 24, 48, 1, true),
    new THREE.MeshStandardMaterial({ color: 0xe9c39a, roughness: .95, side: THREE.DoubleSide }));
  skirt.position.y = 47; contents.add(skirt);

  // particles
  let seed = 5; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const NG = 380, NS = 24, N = NG + NS;
  const P = [];
  for (let i = 0; i < N; i++){
    const star = i >= NG;
    const a = rnd() * 6.283, rr = Math.sqrt(rnd()) * 42;
    P.push({
      star, r: star ? 5 : 1.3 + rnd() * 1.5,
      x: Math.cos(a) * rr, z: Math.sin(a) * rr * .8, y: 0,
      vx: 0, vy: 0, vz: 0, rot: rnd() * 6.28, vr: 0, sleep: false
    });
    P[i].y = moundY(P[i].x, P[i].z) + P[i].r + rnd() * (star ? 26 : 12);
  }
  const grainMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 6, 5),
    new THREE.MeshStandardMaterial({ roughness: .55 }), NG);
  const palette = ['#f6c9d8', '#fdeecb', '#bfe3f2', '#f9d9b8', '#e7c8ee', '#ffffff', '#ffd76e'].map(h => new THREE.Color(h));
  for (let i = 0; i < NG; i++) grainMesh.setColorAt(i, palette[i % palette.length]);
  grainMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); contents.add(grainMesh);
  const starShape = new THREE.Shape();
  for (let k = 0; k < 10; k++){ const rr = k % 2 ? 4.2 : 9.5, a = k * Math.PI / 5 - Math.PI / 2; const px = Math.cos(a) * rr, py = Math.sin(a) * rr; k ? starShape.lineTo(px, py) : starShape.moveTo(px, py); }
  starShape.closePath();
  const starGeo = new THREE.ExtrudeGeometry(starShape, { depth: 3, bevelEnabled: true, bevelSize: 1, bevelThickness: 1 });
  const starMesh = new THREE.InstancedMesh(starGeo,
    new THREE.MeshPhysicalMaterial({ metalness: .9, roughness: .32, envMapIntensity: 1.5 }), NS);
  const starCols = ['#ffc84d', '#ff9ecb', '#9ed8ff'].map(h => new THREE.Color(h));
  for (let i = 0; i < NS; i++) starMesh.setColorAt(i, starCols[i % 3]);
  starMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); contents.add(starMesh);

  // interaction
  let angZ = 0, angX = 0, velZ = 0, velX = 0, tgtZ = 0, tgtX = .02;
  let phi = 0, phiVel = 0;               // contents angle (counter-tilt, laggy)
  let dragging = false, lastX = 0, lastY = 0, lastInteract = 0, interacted = false;
  const el = renderer.domElement;
  el.addEventListener('pointerdown', e => { dragging = true; interacted = true; lastX = e.clientX; lastY = e.clientY; lastInteract = performance.now(); el.setPointerCapture(e.pointerId); el.style.cursor = 'grabbing'; });
  el.addEventListener('pointermove', e => {
    if (!dragging) return;
    tgtZ = THREE.MathUtils.clamp(tgtZ - (e.clientX - lastX) * .005, -.58, .58);
    tgtX = THREE.MathUtils.clamp(tgtX + (e.clientY - lastY) * .003, -.12, .42);
    lastX = e.clientX; lastY = e.clientY; lastInteract = performance.now();
  });
  const end = () => { dragging = false; el.style.cursor = 'grab'; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);

  function resize(){
    const w = wrap.clientWidth, h = wrap.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(wrap); resize();

  const dummy = new THREE.Object3D();
  const qC = new THREE.Quaternion(), qB = new THREE.Quaternion(), qRel = new THREE.Quaternion();
  const v3 = new THREE.Vector3(), gLocal = new THREE.Vector3();
  const t0 = performance.now();
  let first = true;

  renderer.setAnimationLoop(() => {
    const now = performance.now();
    const t = now / 1000, elapsed = (now - t0) / 1000;
    const dt = Math.min(.033, .016 + 0); // fixed-ish step for stability

    // bottle target: auto demo (first seconds / idle), then gentle sway
    if (!interacted && elapsed < 7){
      const k = Math.max(0, 1 - elapsed / 7);
      tgtZ = Math.sin(elapsed * 1.5) * .34 * k + Math.sin(t * .55) * .05;
      tgtX = .03;
    } else if (!dragging && now - lastInteract > 1600){
      tgtZ = Math.sin(t * .55) * .07; tgtX = .03 + Math.sin(t * .42) * .02;
    }
    velZ += (tgtZ - angZ) * .05; velZ *= .90; angZ += velZ;
    velX += (tgtX - angX) * .05; velX *= .90; angX += velX;
    tilt.rotation.z = angZ; tilt.rotation.x = angX; tilt.rotation.y = angZ * .35;
    scene.environmentRotation.y = Math.sin(t * .25) * .25;

    // contents counter-tilt (spring, slower = lag & overshoot)
    phiVel += ((-angZ * .85) - phi) * .028; phiVel *= .93; phi += phiVel;
    contents.rotation.z = phi;
    contents.rotation.x = -angX * .8;

    // gravity expressed in contents frame
    contents.getWorldQuaternion(qC);
    gLocal.set(0, -300, 0).applyQuaternion(qC.clone().invert());
    const shake = Math.min(2.2, Math.abs(velZ) * 26 + Math.abs(phiVel) * 30);
    tilt.getWorldQuaternion(qB);
    qRel.copy(qC).invert().multiply(qB);

    for (let i = 0; i < N; i++){
      const p = P[i];
      if (p.sleep && shake < .25){ continue; }
      p.sleep = false;
      p.vx += gLocal.x * dt; p.vy += gLocal.y * dt; p.vz += gLocal.z * dt;
      if (shake > .3){
        p.vx += (rnd() - .5) * shake * 130 * dt;
        p.vy += rnd() * shake * 90 * dt;
        p.vz += (rnd() - .5) * shake * 90 * dt;
      }
      p.vx *= .992; p.vy *= .995; p.vz *= .992;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      // floor = sand surface
      const fy = moundY(p.x, p.z) + p.r;
      if (p.y < fy){
        p.y = fy;
        if (p.vy < 0) p.vy = -p.vy * (p.star ? .22 : .1);
        p.vx *= .84; p.vz *= .84;
        // roll downhill on the mound slope
        p.vx += (moundY(p.x - 2, p.z) - moundY(p.x + 2, p.z)) * 2.4 * dt * 10;
        p.vz += (moundY(p.x, p.z - 2) - moundY(p.x, p.z + 2)) * 2.4 * dt * 10;
        if (Math.abs(p.vx) + Math.abs(p.vy) + Math.abs(p.vz) < 5 && shake < .2) p.sleep = true;
      }
      // bottle wall clamp (via bottle frame)
      v3.set(p.x, p.y, p.z).applyQuaternion(qRel);
      const ly = v3.y + 10; // mesh-local y (body offset)
      const rr2 = Math.hypot(v3.x, v3.z), maxR = innerR(ly) - p.r - 1;
      let clamped = false;
      if (rr2 > maxR && ly < 150){ const s = maxR / rr2; v3.x *= s; v3.z *= s; clamped = true; }
      if (ly > 122){ v3.y = 112; clamped = true; }
      if (ly < 3){ v3.y = -7; clamped = true; }
      if (clamped){
        v3.applyQuaternion(qRel.clone().invert());
        p.x = v3.x; p.y = v3.y; p.z = v3.z;
        p.vx *= .45; p.vy *= .45; p.vz *= .45;
      }
      p.rot += (p.vx * .012 + p.vr) * dt * 8;
    }
    for (let i = 0; i < NG; i++){
      const p = P[i];
      dummy.position.set(p.x, p.y, p.z);
      dummy.scale.setScalar(p.r);
      dummy.rotation.set(0, p.rot, 0);
      dummy.updateMatrix();
      grainMesh.setMatrixAt(i, dummy.matrix);
    }
    for (let i = 0; i < NS; i++){
      const p = P[NG + i];
      dummy.position.set(p.x, p.y, p.z);
      dummy.scale.setScalar(.62);
      dummy.rotation.set(p.rot * .7, p.rot, p.rot * .4);
      dummy.updateMatrix();
      starMesh.setMatrixAt(i, dummy.matrix);
    }
    grainMesh.instanceMatrix.needsUpdate = true;
    starMesh.instanceMatrix.needsUpdate = true;

    renderer.render(scene, camera);
    if (first){ first = false; loading.style.display = 'none'; }
  });
}
try { init(); } catch (e) { console.error(e); loading.textContent = 'この端末では3D表示が使えませんでした。'; }
</script>
