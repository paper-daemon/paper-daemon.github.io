<style>
.omikuji-stage{max-width:560px;margin:0 auto;text-align:center}
.box-wrap{position:relative;height:190px;display:flex;align-items:flex-end;justify-content:center}
.stick{position:absolute;bottom:118px;left:50%;width:12px;height:0;margin-left:-6px;background:linear-gradient(90deg,#e8c98a,#f7e3ae,#e8c98a);border-radius:5px 5px 0 0;opacity:0}
.stick.out{animation:stickOut.55s cubic-bezier(.2,1.2,.4,1) both}
@keyframes stickOut{0%{height:0;opacity:0}25%{opacity:1}100%{height:96px;opacity:1}}
.box{position:relative;width:190px;height:130px;background:linear-gradient(180deg,#8a4b2d,#6f3a20);border:3px solid #4c2712;border-radius:14px;box-shadow:6px 6px 0 rgba(19,24,71,.35);z-index:2}
.box:before{content:"";position:absolute;inset:12px;border:2px solid rgba(255,235,190,.5);border-radius:9px}
.box.box-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ffe9bb;font:900 1.5rem var(--sans);letter-spacing:.35em;text-indent:.35em}
.box.shake{animation:shake.5s ease-in-out 2}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg) translateY(-3px)}45%{transform:rotate(4.5deg)}70%{transform:rotate(-3deg) translateY(-2px)}}
.draw-btn{margin-top:24px;font-size:1.05rem;padding:16px 34px}
.slip{margin:34px auto 0;width:min(300px,86vw);background:repeating-linear-gradient(180deg,#fffdf4 0 26px,#fdf6df 26px 27px);border:2px solid #d8c48f;border-radius:4px;box-shadow:6px 8px 0 rgba(19,24,71,.22);padding:26px 20px 22px;transform-origin:top center;position:relative}
.slip:before,.slip:after{content:"";position:absolute;left:0;right:0;height:8px;background-image:radial-gradient(circle at 6px 4px,transparent 3.5px,#e7d9ae 4px);background-size:14px 8px}
.slip:before{top:-2px}.slip:after{bottom:-2px;transform:scaleY(-1)}
.slip.unfold{animation:unfold.6s cubic-bezier(.2,1.1,.4,1) both}
@keyframes unfold{0%{opacity:0;transform:scaleY(.15) rotateX(38deg)}100%{opacity:1;transform:none}}
.slip.stamp{display:inline-flex;align-items:center;justify-content:center;width:104px;height:104px;border:4px solid #d23b2a;border-radius:50%;color:#d23b2a;font:900 2rem/1 var(--sans);transform:rotate(-7deg);margin:4px 0 6px;background:rgba(210,59,42,.05)}
.slip.word{color:var(--ink-dim);line-height:2;margin:14px 0 0;font-size:.94rem}
.slip.lucky{margin-top:16px;font-size:.85rem;border-top:1.5px dashed #d8c48f;padding-top:14px}
.slip.lucky b{background:linear-gradient(transparent 62%,var(--yellow) 62%,var(--yellow) 94%,transparent 94%);padding:0 4px}
.slip-actions{margin-top:16px}
.count-note{margin-top:18px;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion:reduce){.box.shake,.stick.out,.slip.unfold{animation:none}}
</style>
</head>
<body>
<header class="site-head"><a class="brand" href="/"><img class="brand-avatar" src="https://assets.st-note.com/production/uploads/images/330115961/profile_af83ab87ce408fb4fa41f8190406f1bf.png?width=400" alt=""><span class="brand-copy"><strong>シェルフィリア</strong><small>SHELFIRIA</small></span></a><nav aria-label="main"><a href="/demo.html" aria-current="page">あそぶ</a><a href="/showcase.html">みる</a><a href="/notes/">よむ</a><a href="/work.html">おまけ</a></nav><div class="head-actions"><a class="social-mini" href="https://www.threads.com/@ive.amase" aria-label="Threads">Th</a><a class="social-mini" href="https://www.instagram.com/ive.amase/" aria-label="Instagram">IG</a><a class="social-mini" href="https://x.com/amase__iv" aria-label="X">X</a><a class="head-cta" href="/demo.html">あそぶ →</a></div></header>
<main class="page">
<section class="page-hero" style="border-bottom:none;padding-bottom:10px"><p class="eyebrow">PLAY — OMIKUJI</p><h1>イヴおみくじ</h1><p class="page-lead">今日の運勢と、イヴからの一言。気に入らなかったら、引き直してOKです。</p></section>
<section class="section" style="border-bottom:none;padding-top:16px">
<div class="omikuji-stage">
<div class="box-wrap"><div class="stick" id="stick"></div><div class="box" id="box"><span class="box-label">おみくじ</span></div></div>
<div><button class="button primary draw-btn" id="drawBtn" type="button">おみくじを引く</button></div>
<div class="slip" id="slip" hidden>
<div class="stamp" id="fortuneText">大吉</div>
<p class="word" id="wordText"></p>
<p class="lucky">ラッキーアイテム：<b id="luckyText"></b></p>
<div class="slip-actions"><button class="button soft" id="copyBtn" type="button" style="padding:10px 18px;font-size:.85rem">結果をコピー</button></div>
</div>
<p class="count-note" id="countNote"></p>
</div>
</section>
</main>
<footer class="site-footer"><div class="footer-brand"><img src="https://assets.st-note.com/production/uploads/images/330115961/profile_af83ab87ce408fb4fa41f8190406f1bf.png?width=400" alt=""><span><strong>シェルフィリア</strong><br>SHELFIRIA</span></div><nav><a href="/">トップ</a><a href="/demo.html" aria-current="page">あそぶ</a><a href="/showcase.html">みる</a><a href="/notes/">よむ</a><a href="/work.html">おまけ</a><a href="https://www.threads.com/@ive.amase">Threads</a><a href="https://www.instagram.com/ive.amase/">Instagram</a><a href="https://x.com/amase__iv">X</a><a href="https://github.com/paper-daemon">GitHub</a><a href="https://amase-lab.booth.pm/">BOOTH</a></nav></footer>
<script>
const FORTUNES=[["大吉",14],["中吉",22],["小吉",22],["吉",22],["末吉",12],["凶",8]];
const WORDS=[
"今日は「とりあえず触ってみる」が当たりの日。考える前に一度開いてみて。",
"細かいところを一個だけ直すと、全体が急に良くなります。一個だけ、ね。",
"迷ったら軽い方。今日はスピードが正義です。",
"誰かに一言ありがとうを言うと、運の流れが変わります。たぶん本当。",
"おやつは我慢しない方がいい日。判断力は糖分から。",
"新しいものより、積んでたものが輝く日。一個崩していきましょ。",
"今日の勝ち筋は「早く寝る」。夜更かしは明日の自分への借金です。",
"気になってたあの件、今日聞くと意外とすんなり進みます。",
"小さなバグは小さいうちに。放置すると可愛くなくなります。",
"一回深呼吸。焦ってる時ほど、手はゆっくりで大丈夫。",
"今日は褒められやすい日。受け取り上手でいきましょ。",
"「まあいっか」が効く日。完璧じゃなくていいんです。"
];
const LUCKY=["赤いもの","温かい飲み物","片付けた机","新しいタオル","音楽を1曲","窓の外の空","予備の充電ケーブル","短い散歩","お気に入りの文房具","深呼吸3回"];
function pickFortune(){let r=Math.random()*100;for(const [n,w] of FORTUNES){if((r-=w)<0)return n}return "吉"}
let AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function rustle(){const ac=audio();if(!ac)return;const len=ac.sampleRate*0.18;const buf=ac.createBuffer(1,len,ac.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const src=ac.createBufferSource();src.buffer=buf;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=2400;const g=ac.createGain();g.gain.value=0.12;src.connect(f);f.connect(g);g.connect(ac.destination);src.start()}
function thunk(){const ac=audio();if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(190,ac.currentTime);o.frequency.exponentialRampToValueAtTime(70,ac.currentTime+0.12);g.gain.setValueAtTime(0.18,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.14);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.15)}
const btn=document.getElementById('drawBtn'),box=document.getElementById('box'),stick=document.getElementById('stick'),slip=document.getElementById('slip');
let count=Number(localStorage.getItem('omikujiCount')||0);
function note(){document.getElementById('countNote').textContent=count>0?`これまでに ${count} 回引きました`:""}
note();
btn.addEventListener('click',()=>{
btn.disabled=true;rustle();
box.classList.remove('shake');stick.classList.remove('out');void box.offsetWidth;
box.classList.add('shake');
setTimeout(()=>{stick.classList.add('out');thunk()},650);
setTimeout(()=>{
document.getElementById('fortuneText').textContent=pickFortune();
document.getElementById('wordText').textContent=WORDS[Math.floor(Math.random()*WORDS.length)];
document.getElementById('luckyText').textContent=LUCKY[Math.floor(Math.random()*LUCKY.length)];
slip.hidden=false;slip.classList.remove('unfold');void slip.offsetWidth;slip.classList.add('unfold');
count++;localStorage.setItem('omikujiCount',count);note();
btn.textContent='もう一回引く';btn.disabled=false;
},1250);
});
document.getElementById('copyBtn').addEventListener('click',function(){
const text=`${document.getElementById('fortuneText').textContent}｜${document.getElementById('wordText').textContent} ラッキーアイテム：${document.getElementById('luckyText').textContent}（シェルフィリア）`;
const done=()=>{this.textContent='コピーしました';setTimeout(()=>this.textContent='結果をコピー',1600)};
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(done)}else{done()}
});
</script>
<script src="/ad-overlay.js" defer></script>
</body></html>
