<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>イヴおみくじ | あませ</title>
<meta name="description" content="あませの小さな遊び場。今日の運勢と、イヴからの一言をどうぞ。何度でも引けます。">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#131847">
<link rel="stylesheet" href="/site.css?v=20261027-2">
<style>
.omikuji-stage{max-width:560px;margin:0 auto;text-align:center}
.cylinder{font-size:5.2rem;line-height:1;display:inline-block;filter:drop-shadow(4px 4px 0 rgba(19,24,71,.18))}
.cylinder.shake{animation:shake .5s ease-in-out 2}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg) translateY(-4px)}45%{transform:rotate(8deg)}70%{transform:rotate(-6deg) translateY(-2px)}}
.draw-btn{margin-top:22px;font-size:1.05rem;padding:16px 34px}
.result-card{margin:30px auto 0;max-width:480px;background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:7px 7px 0 var(--ink);padding:28px 24px;opacity:0;transform:translateY(16px) scale(.97)}
.result-card.show{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{to{opacity:1;transform:none}}
.result-card .fortune{font:900 3rem/1.1 var(--sans);margin:6px 0 4px}
.result-card .word{color:var(--ink-dim);line-height:1.9;margin:12px 0 0}
.result-card .lucky{margin-top:16px;font-size:.85rem}
.result-card .lucky b{background:linear-gradient(transparent 62%,var(--yellow) 62%,var(--yellow) 94%,transparent 94%);padding:0 4px}
.count-note{margin-top:18px;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion:reduce){.cylinder.shake,.result-card.show{animation:none}.result-card{opacity:1;transform:none}}
</style>
</head>
<body>
<header class="site-head"><a class="brand" href="/"><img class="brand-avatar" src="/amase-avatar.jpg" alt=""><span class="brand-copy"><strong>あませ</strong><small>AMASE</small></span></a><nav aria-label="main"><a href="/demo.html">あそぶ</a><a href="/showcase.html">みる</a><a href="/notes/">よむ</a><a href="/products.html">おまけ</a></nav><div class="head-actions"><a class="social-mini" href="https://www.threads.com/@ive.amase" aria-label="Threads">Th</a><a class="social-mini" href="https://www.instagram.com/ive.amase/" aria-label="Instagram">IG</a><a class="social-mini" href="https://x.com/amase__iv" aria-label="X">X</a><a class="head-cta" href="/demo.html">あそぶ →</a></div></header>
<main class="page">
<section class="page-hero" style="border-bottom:none;padding-bottom:10px"><p class="eyebrow">PLAY — OMIKUJI</p><h1>イヴおみくじ</h1><p class="page-lead">今日の運勢と、イヴからの一言。気に入らなかったら、引き直してOKです。</p></section>
<section class="section" style="border-bottom:none;padding-top:16px">
<div class="omikuji-stage">
<div class="cylinder" id="cylinder" aria-hidden="true">🎋</div>
<div><button class="button primary draw-btn" id="drawBtn" type="button">おみくじを引く</button></div>
<div class="result-card" id="resultCard" hidden>
<p class="eyebrow" style="margin-bottom:2px">TODAY'S FORTUNE</p>
<p class="fortune" id="fortuneText">大吉</p>
<p class="word" id="wordText"></p>
<p class="lucky">ラッキーアイテム：<b id="luckyText"></b></p>
</div>
<p class="count-note" id="countNote"></p>
</div>
</section>
</main>
<footer class="site-footer"><div class="footer-brand"><img src="/amase-avatar.jpg" alt=""><span><strong>あませ</strong><br>AMASE</span></div><nav><a href="/">Home</a><a href="/showcase.html">制作物</a><a href="/demo.html">デモ</a><a href="/work.html">仕事</a><a href="/notes/">メモ</a><a href="/products.html">商品</a><a href="https://www.threads.com/@ive.amase">Threads</a><a href="https://www.instagram.com/ive.amase/">Instagram</a><a href="https://x.com/amase__iv">X</a><a href="https://github.com/paper-daemon">GitHub</a><a href="https://amase-lab.booth.pm/">BOOTH</a></nav></footer>
<script>
const FORTUNES=[["大吉",14],["中吉",22],["小吉",22],["吉",22],["末吉",12],["凶",8]];
const WORDS=[
"今日は「とりあえず触ってみる」が当たりの日。考える前に一度開いてみて。",
"細かいところを一個だけ直すと、全体が急に良くなります。一個だけ、ね。",
"迷ったら軽い方。今日はスピードが正義です。",
"誰かに一言ありがとうを言うと、運の流れが変わります。たぶん本当。",
"おやつは我慢しない方がいい日。判断力は糖分から。",
"新しいものより、積んでたものが輝く日。一個崩していきましょ。",
"今日の勝ち筋は「早く寝る」。夜更かしは明日の自分への借金です。",
"気になってたあの件、今日聞くと意外とすんなり進みます。",
"小さなバグは小さいうちに。放置すると可愛くなくなります。",
"一回深呼吸。焦ってる時ほど、手はゆっくりで大丈夫。",
"今日は褒められやすい日。受け取り上手でいきましょ。",
"「まあいっか」が効く日。完璧じゃなくていいんです。"
];
const LUCKY=["赤いもの","温かい飲み物","片付けた机","新しいタオル","音楽を1曲","窓の外の空","予備の充電ケーブル","短い散歩","お気に入りの文房具","深呼吸3回"];
function pickFortune(){let r=Math.random()*100;for(const [n,w] of FORTUNES){if((r-=w)<0)return n}return "吉"}
const btn=document.getElementById('drawBtn'),cyl=document.getElementById('cylinder'),card=document.getElementById('resultCard');
let count=Number(localStorage.getItem('omikujiCount')||0);
function note(){document.getElementById('countNote').textContent=count>0?`これまでに ${count} 回引きました`:""}
note();
btn.addEventListener('click',()=>{
  btn.disabled=true;cyl.classList.remove('shake');void cyl.offsetWidth;cyl.classList.add('shake');
  setTimeout(()=>{
    document.getElementById('fortuneText').textContent=pickFortune();
    document.getElementById('wordText').textContent=WORDS[Math.floor(Math.random()*WORDS.length)];
    document.getElementById('luckyText').textContent=LUCKY[Math.floor(Math.random()*LUCKY.length)];
    card.hidden=false;card.classList.remove('show');void card.offsetWidth;card.classList.add('show');
    count++;localStorage.setItem('omikujiCount',count);note();
    btn.textContent='もう一回引く';btn.disabled=false;
  },900);
});
</script>
<script src="/ad-overlay.js" defer></script>
</body></html>
