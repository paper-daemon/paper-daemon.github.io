<style>.jk-stage{max-width:560px;margin:0 auto;text-align:center;background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 var(--ink);padding:30px 22px 32px;position:relative;overflow:hidden}
.jk-stage:before{content:"";position:absolute;top:0;left:0;right:0;height:8px;background:linear-gradient(90deg,#ff5d8f,#ffb84d)}
.duel{background:#f6f7ff;border-radius:16px;padding:12px 0 8px}
.hands{display:flex;gap:14px;justify-content:center;margin:20px 0}
.hand{font:900 1.05rem var(--sans);padding:18px 22px;border:2px solid var(--ink);border-radius:16px;background:#fff;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .12s}
.hand:hover{transform:translateY(-3px)}
.duel{display:flex;justify-content:center;gap:36px;align-items:center;margin:8px 0 4px;font:900 2rem var(--sans)}
.vs{font:700 .7rem var(--mono);color:var(--muted)}
.result{font-weight:900;font-size:1.3rem;min-height:1.7em;margin:12px 0 2px}
.eve-line{color:var(--ink-dim);line-height:1.9;min-height:1.9em}
.score{font:700 .85rem var(--mono);color:var(--muted);margin-top:12px}
.match{display:flex;gap:16px;justify-content:center;margin-top:8px;font:700 .8rem var(--mono);color:var(--ink-dim)}
.pips{letter-spacing:.18em}
.prev{font-size:.8rem;color:var(--muted);min-height:1.4em;margin-top:2px}
.duel2{display:flex;justify-content:center;gap:8px;align-items:center;margin:4px 0}
.fighter{width:42%;max-width:190px;text-align:center}
.fighter .who{font:700 .68rem var(--mono);color:var(--muted);letter-spacing:.14em}
.handview{position:relative;height:168px;display:flex;align-items:center;justify-content:center}
.handview img{max-height:168px;max-width:100%;filter:drop-shadow(0 8px 12px rgba(20,20,60,.25))}
.handview .emo{font-size:5.2rem;line-height:1}
#eveView img,#eveView .emo{transform:rotate(180deg)}
.handview.shaking{animation:jkshake .26s ease-in-out infinite}
@keyframes jkshake{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
.beat{font:900 1.5rem var(--sans);min-height:1.5em;color:var(--ink)}
.handbtn{display:flex;flex-direction:column;align-items:center;gap:2px;font:900 .95rem var(--sans);padding:10px 14px;border:2px solid var(--ink);border-radius:16px;background:#fff;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .12s}
.handbtn:hover{transform:translateY(-3px)}
.handbtn:disabled{opacity:.55;cursor:wait}
.handbtn img{height:52px;width:auto}
#fxVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:screen;opacity:0;pointer-events:none;transition:opacity .25s}
#fxVideo.on{opacity:.95}
.bgm-row{text-align:right;max-width:560px;margin:0 auto 6px}
.bgm-toggle{border:2px solid var(--ink);background:#fff;border-radius:99px;padding:4px 14px;font:700 .78rem var(--sans);cursor:pointer}
.bgm-toggle.off{opacity:.5}</style>
</head>
<body>

<main class="page">
<section class="page-hero" style="border-bottom:none;padding-bottom:10px"><p class="eyebrow">PLAY — JANKEN</p><h1>あませとじゃんけん</h1><p class="page-lead">あませとじゃんけん。5本先取でマッチ勝利です。あませは負けず嫌いなので、負けた次はあなたの前の手を狩りに来るクセがあります。前の手を読んで裏をかくのがコツ。</p></section>
<section class="section" style="border-bottom:none;padding-top:16px">
<div class="jk-stage">
<div class="bgm-row" style="max-width:none;margin:0 0 4px"><button class="bgm-toggle" id="bgmBtn" type="button">♪ BGM</button></div>
<div class="duel2">
<div class="fighter"><p class="who">AMASE</p><div class="handview" id="eveView"><span class="emo" id="eveEmo">✊</span><img id="eveImg" src="/play/assets/hand-rock.png" alt="あませの手" onerror="this.remove()"></div></div>
<div class="fighter"><p class="who">YOU</p><div class="handview" id="youView"><span class="emo" id="youEmo">✊</span><img id="youImg" src="/play/assets/hand-rock.png" alt="あなたの手" onerror="this.remove()"></div></div>
</div>
<p class="beat" id="beat"></p>
<p class="result" id="result">手を選んでね</p>
<p class="eve-line" id="eveLine">あませ「本気で来ていいよ。負けず嫌いだから」</p>
<div class="hands">
<button class="handbtn" data-h="0" type="button"><img src="/play/assets/hand-rock.png" alt="" onerror="this.outerHTML='✊'">グー</button>
<button class="handbtn" data-h="1" type="button"><img src="/play/assets/hand-scissors.png" alt="" onerror="this.outerHTML='✌️'">チョキ</button>
<button class="handbtn" data-h="2" type="button"><img src="/play/assets/hand-paper.png" alt="" onerror="this.outerHTML='✋'">パー</button>
</div>
<video id="fxVideo" muted playsinline preload="auto"></video>
<div class="match"><span>YOU <span class="pips" id="pipsYou">○○○○○</span></span><span>先取5本でマッチ</span><span><span class="pips" id="pipsEve">○○○○○</span> EVE</span></div>
<p class="prev" id="prevLine"></p>
<p class="score" id="score">0勝 0敗 0分 ｜ 連勝 0</p>
</div>

<script>let AC=null;function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d,type,v,when){const ac=audio();if(!ac)return;const t=ac.currentTime+(when||0);const o=ac.createOscillator(),g=ac.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(v||0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+0.02)}
/* file audio (Flow Music, cleaned) with beep fallback */
const oggOkJ=(()=>{const a=document.createElement('audio');return !!(a.canPlayType&&a.canPlayType('audio/ogg; codecs="vorbis"').replace(/no/,''))})();
const EXTJ=oggOkJ?'ogg':'mp3';
function mkA(s,v,loop){const a=new Audio();a.preload='auto';a.src=s;a.volume=v;if(loop)a.loop=true;return a}
const JAU={bgm:mkA('/play/assets/bgm_janken_loop.'+EXTJ,0.3,true),pon:mkA('/play/assets/se-janken-pon.'+EXTJ,0.6),win:mkA('/play/assets/se-janken-win.'+EXTJ,0.6),lose:mkA('/play/assets/se-janken-lose.'+EXTJ,0.55),draw:mkA('/play/assets/se-janken-draw.'+EXTJ,0.55)};
function jplay(a){if(!a||a.networkState===3)return false;try{a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>{});return true}catch(e){return false}}
let jBgmOn=true,jBgmStarted=false;
function jBgmStart(){if(jBgmStarted||!jBgmOn)return;if(JAU.bgm&&JAU.bgm.networkState!==3){try{const p=JAU.bgm.play();if(p&&p.catch)p.catch(()=>{});jBgmStarted=true}catch(e){}}}
document.getElementById('bgmBtn').addEventListener('click',function(){jBgmOn=!jBgmOn;this.classList.toggle('off',!jBgmOn);if(!jBgmOn){JAU.bgm.pause();jBgmStarted=false}else jBgmStart()});
function vibJ(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
const HANDIMG=['/play/assets/hand-rock.png','/play/assets/hand-scissors.png','/play/assets/hand-paper.png'];
const HANDEMO=['✊','✌️','✋'];
function setHand(view,imgEl,emoEl,h){
  if(imgEl){imgEl.src=HANDIMG[h];emoEl.style.display='none';imgEl.style.display=''}
  else{emoEl.textContent=HANDEMO[h]}
}
const fxv=document.getElementById('fxVideo');
function playVictoryFx(){
  const src='/play/assets/janken-victory-fx.mp4';
  const go=()=>{try{fxv.currentTime=0;const p=fxv.play();if(p&&p.catch)p.catch(()=>{});fxv.classList.add('on');fxv.onended=()=>fxv.classList.remove('on');setTimeout(()=>fxv.classList.remove('on'),3700)}catch(e){}};
  if(fxv.dataset.src!==src){fxv.dataset.src=src;fxv.src=src;fxv.addEventListener('canplay',function h(){fxv.removeEventListener('canplay',h);go()});fxv.load()}else go();
}
const NAMES=["グー","チョキ","パー"];
let w=0,l=0,d=0,streak=0,mpYou=0,mpEve=0,lastYou=-1,lastOut="";
let matchYou=Number(localStorage.getItem("jkMatchYou")||0),matchEve=Number(localStorage.getItem("jkMatchEve")||0);
const LINES={win:["あませ「むむ…やるね」","あませ「次は勝つから」","あませ「今のは運。たぶん」"],lose:["あませ「はい、私の勝ち」","あませ「読み通りでした」","あませ「もう一回来る？」"],draw:["あませ「気が合うね」","あませ「あいこ。次で決めよ」"],
matchWin:["あませ「マッチ取られた…くやしい。もう1マッチ！」"],matchLose:["あませ「マッチは私のもの。はい、次いこ」"]};
const result=document.getElementById("result"),line=document.getElementById("eveLine"),score=document.getElementById("score"),prevLine=document.getElementById("prevLine");
function pips(n){return "●".repeat(n)+"○".repeat(5-n)}
function paintScore(){
document.getElementById("pipsYou").textContent=pips(mpYou);
document.getElementById("pipsEve").textContent=pips(mpEve);
let st="";if(streak>=8)st="【無双】";else if(streak>=5)st="【絶好調】";else if(streak>=3)st="【好調】";
score.textContent=w+"勝 "+l+"敗 "+d+"分 ｜ 連勝 "+streak+st+" ｜ マッチ あなた"+matchYou+" — あませ"+matchEve;
prevLine.textContent=lastYou>=0?("あませの狙いメモ：あなたは前回「"+NAMES[lastYou]+"」。負けた次のあませは、それに勝つ手を出しがち"):"";
}
function pickEve(){
if(lastOut==="win"&&lastYou>=0&&Math.random()<0.55)return (lastYou+2)%3;
return Math.floor(Math.random()*3);
}
let busy=false;
const eveView=document.getElementById("eveView"),youView=document.getElementById("youView"),beatEl=document.getElementById("beat");
const eveImg=document.getElementById("eveImg"),youImg=document.getElementById("youImg"),eveEmo=document.getElementById("eveEmo"),youEmo=document.getElementById("youEmo");
function reveal(you,eve){
let out;
if(you===eve){out="draw";d++;streak=0;result.textContent="あいこ";if(!jplay(JAU.draw))tone(520,0.09,"sine",0.1)}
else if((you-eve+3)%3===2){out="win";w++;streak++;mpYou++;result.textContent="あなたの勝ち！";if(!jplay(JAU.win)){tone(784,0.12,"sine",0.12);tone(1047,0.18,"sine",0.12,0.1)}vibJ(30)}
else{out="lose";l++;streak=0;mpEve++;result.textContent="あませの勝ち";if(!jplay(JAU.lose))tone(262,0.14,"triangle",0.1);vibJ([20,40,20])}
let lineArr=LINES[out];
if(mpYou>=5){matchYou++;localStorage.setItem("jkMatchYou",matchYou);result.textContent="マッチ獲得！！ あなたの勝ち";lineArr=LINES.matchWin;mpYou=0;mpEve=0;playVictoryFx();vibJ([50,40,50,40,120]);tone(784,0.12,"sine",0.12);tone(988,0.12,"sine",0.12,0.1);tone(1318,0.26,"sine",0.12,0.2)}
else if(mpEve>=5){matchEve++;localStorage.setItem("jkMatchEve",matchEve);result.textContent="マッチはあませのもの…";lineArr=LINES.matchLose;mpYou=0;mpEve=0}
else if(out==="win"&&streak>=5){playVictoryFx()}
line.textContent=lineArr[Math.floor(Math.random()*lineArr.length)];
lastYou=you;lastOut=out;
paintScore();
}
document.querySelectorAll(".handbtn").forEach(b=>b.addEventListener("click",()=>{
if(busy)return;busy=true;jBgmStart();
const you=Number(b.dataset.h);const eve=pickEve();
document.querySelectorAll(".handbtn").forEach(x=>x.disabled=true);
setHand(youView,youImg,youEmo,0);setHand(eveView,eveImg,eveEmo,0);
eveView.classList.add("shaking");youView.classList.add("shaking");
beatEl.textContent="じゃん";tone(440,0.06,"square",0.06);
setTimeout(()=>{beatEl.textContent="けん";tone(440,0.06,"square",0.06)},280);
setTimeout(()=>{
beatEl.textContent="ぽん！";if(!jplay(JAU.pon))tone(920,0.08,"sine",0.13);vibJ(18);
eveView.classList.remove("shaking");youView.classList.remove("shaking");
setHand(youView,youImg,youEmo,you);setHand(eveView,eveImg,eveEmo,eve);
reveal(you,eve);
document.querySelectorAll(".handbtn").forEach(x=>x.disabled=false);
busy=false;
},560);
}));
paintScore();</script>
