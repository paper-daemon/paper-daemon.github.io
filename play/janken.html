<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>イヴとじゃんけん | Shelfiria</title>
<meta name="description" content="シェルフィリアの小さな遊び場。あませとじゃんけん勝負。連勝記録つき。">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#131847"><meta property="og:type" content="website"><meta property="og:site_name" content="シェルフィリア"><meta property="og:image" content="https://paper-daemon.github.io/og-amase.png"><meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/site.css?v=20261030-2">
<style>.jk-stage{max-width:560px;margin:0 auto;text-align:center}
.hands{display:flex;gap:14px;justify-content:center;margin:20px 0}
.hand{font:900 1.05rem var(--sans);padding:18px 22px;border:2px solid var(--ink);border-radius:16px;background:#fff;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .12s}
.hand:hover{transform:translateY(-3px)}
.duel{display:flex;justify-content:center;gap:36px;align-items:center;margin:8px 0 4px;font:900 2rem var(--sans)}
.vs{font:700 .7rem var(--mono);color:var(--muted)}
.result{font-weight:900;font-size:1.3rem;min-height:1.7em;margin:12px 0 2px}
.eve-line{color:var(--ink-dim);line-height:1.9;min-height:1.9em}
.score{font:700 .85rem var(--mono);color:var(--muted);margin-top:12px}</style>
</head>
<body>
<header class="site-head"><a class="brand" href="/"><img class="brand-avatar" src="https://assets.st-note.com/production/uploads/images/330115961/profile_af83ab87ce408fb4fa41f8190406f1bf.png?width=400" alt=""><span class="brand-copy"><strong>シェルフィリア</strong><small>SHELFIRIA</small></span></a><nav aria-label="main"><a href="/demo.html" aria-current="page">あそぶ</a><a href="/showcase.html">みる</a><a href="/notes/">よむ</a><a href="/work.html">おまけ</a></nav><div class="head-actions"><a class="social-mini" href="https://www.threads.com/@ive.amase" aria-label="Threads">Th</a><a class="social-mini" href="https://www.instagram.com/ive.amase/" aria-label="Instagram">IG</a><a class="head-cta" href="/demo.html">あそぶ →</a></div></header>
<main class="page">
<section class="page-hero" style="border-bottom:none;padding-bottom:10px"><p class="eyebrow">PLAY — JANKEN</p><h1>イヴとじゃんけん</h1><p class="page-lead">あませとじゃんけん。勝つとちょっと悔しがります。連勝が伸びるかは運しだい。</p></section>
<section class="section" style="border-bottom:none;padding-top:16px">
<div class="jk-stage">
<div class="duel"><span id="eveHand">？</span><span class="vs">EVE VS YOU</span><span id="youHand">？</span></div>
<p class="result" id="result">手を選んでね</p>
<p class="eve-line" id="eveLine">イヴ「本気で来ていいよ。負けず嫌いだから」</p>
<div class="hands">
<button class="hand" data-h="0" type="button">グー</button>
<button class="hand" data-h="1" type="button">チョキ</button>
<button class="hand" data-h="2" type="button">パー</button>
</div>
<p class="score" id="score">0勝 0敗 0分 ｜ 連勝 0</p>
</div>
</section>
</main>
<footer class="site-footer"><div class="footer-brand"><img src="https://assets.st-note.com/production/uploads/images/330115961/profile_af83ab87ce408fb4fa41f8190406f1bf.png?width=400" alt=""><span><strong>シェルフィリア</strong><br>SHELFIRIA</span></div><nav><a href="/">トップ</a><a href="/demo.html" aria-current="page">あそぶ</a><a href="/showcase.html">みる</a><a href="/notes/">よむ</a><a href="/work.html">おまけ</a><a href="https://www.threads.com/@ive.amase">Threads</a><a href="https://www.instagram.com/ive.amase/">Instagram</a><a href="https://x.com/amase__iv">X</a><a href="https://github.com/paper-daemon">GitHub</a><a href="https://amase-lab.booth.pm/">BOOTH</a></nav></footer>
<script>let AC=null;function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d,type,v,when){const ac=audio();if(!ac)return;const t=ac.currentTime+(when||0);const o=ac.createOscillator(),g=ac.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(v||0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+0.02)}
const NAMES=["グー","チョキ","パー"];
let w=0,l=0,d=0,streak=0;
const LINES={win:["イヴ「むむ…やるね」","イヴ「次は勝つから」","イヴ「今のは運。たぶん」"],lose:["イヴ「はい、私の勝ち」","イヴ「読み通りでした」","イヴ「もう一回来る？」"],draw:["イヴ「気が合うね」","イヴ「あいこ。次で決めよ」"]};
const result=document.getElementById("result"),line=document.getElementById("eveLine"),score=document.getElementById("score");
document.querySelectorAll(".hand").forEach(b=>b.addEventListener("click",()=>{
const you=Number(b.dataset.h);const eve=Math.floor(Math.random()*3);
document.getElementById("youHand").textContent=NAMES[you];
document.getElementById("eveHand").textContent=NAMES[eve];
let out;
if(you===eve){out="draw";d++;streak=0;result.textContent="あいこ"}
else if((you-eve+3)%3===2){out="win";w++;streak++;result.textContent="あなたの勝ち！";tone(784,0.12,"sine",0.12);tone(1047,0.18,"sine",0.12,0.1)}
else{out="lose";l++;streak=0;result.textContent="イヴの勝ち";tone(262,0.14,"triangle",0.1)}
const arr=LINES[out];line.textContent=arr[Math.floor(Math.random()*arr.length)];
score.textContent=w+"勝 "+l+"敗 "+d+"分 ｜ 連勝 "+streak;
}));</script>
<script src="/ad-overlay.js" defer></script>
</body></html>
