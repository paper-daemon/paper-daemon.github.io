<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>止めて！タイミングバー | あませ</title>
<meta name="description" content="あませの小さな遊び場。動くバーを狙った場所で止めるだけの、シンプルな反射ゲーム。全5ラウンド。">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#131847"><meta property="og:type" content="website"><meta property="og:site_name" content="あませ"><meta property="og:image" content="https://paper-daemon.github.io/og-amase.png"><meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/site.css?v=20261030-1">
<style>
.game-stage{max-width:560px;margin:0 auto;position:relative}
.track{position:relative;height:68px;background:linear-gradient(180deg,#fff,#f2f3fa);border:2px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:rgba(255,210,63,.65);border-left:2px dashed var(--ink);border-right:2px dashed var(--ink);transition:background .15s}
.zone.flash{background:rgba(88,220,140,.75)}
.marker{position:absolute;top:5px;bottom:5px;width:10px;border-radius:5px;background:var(--red,#ff4b33);left:0;box-shadow:0 0 0 3px rgba(255,75,51,.18),0 0 14px rgba(255,75,51,.45)}
.track.hit .marker{background:#2fbf71;box-shadow:0 0 0 3px rgba(47,191,113,.2),0 0 14px rgba(47,191,113,.5)}
.judge{position:absolute;left:50%;top:-8px;transform:translate(-50%,-100%);font:900 1.25rem var(--sans);color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:999px;padding:6px 16px;box-shadow:4px 4px 0 var(--ink);opacity:0;pointer-events:none;white-space:nowrap}
.judge.pop{animation:judgePop 1s cubic-bezier(.2,1.2,.4,1) both}
@keyframes judgePop{0%{opacity:0;transform:translate(-50%,-60%) scale(.7)}18%{opacity:1;transform:translate(-50%,-110%) scale(1.05)}30%{transform:translate(-50%,-100%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-130%)}}
.pts-float{position:absolute;font:900 1.4rem var(--mono);color:var(--indigo);opacity:0;pointer-events:none}
.pts-float.pop{animation:ptsUp 1s ease-out both}
@keyframes ptsUp{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-44px)}}
.stop-btn{margin-top:26px;width:100%;font-size:1.1rem;padding:18px}
.hud{display:flex;justify-content:space-between;gap:10px;margin:18px 2px 0;font:800 .8rem var(--mono);color:var(--ink-dim)}
.result{margin-top:22px;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:22px;box-shadow:5px 5px 0 var(--line-soft)}
.result .rank{font:900 1.7rem/1.2 var(--sans)}
.result ul{margin:14px 0 0;padding:0;list-style:none;font:700 .84rem var(--mono);color:var(--ink-dim)}
.result li{display:flex;justify-content:space-between;border-top:1.5px dashed var(--line-soft);padding:7px 2px}
</style>
</head>
<body>
<header class="site-head"><a class="brand" href="/"><img class="brand-avatar" src="/amase-avatar.jpg" alt=""><span class="brand-copy"><strong>あませ</strong><small>AMASE</small></span></a><nav aria-label="main"><a href="/demo.html" aria-current="page">あそぶ</a><a href="/showcase.html">みる</a><a href="/notes/">よむ</a><a href="/work.html">おまけ</a></nav><div class="head-actions"><a class="social-mini" href="https://www.threads.com/@ive.amase" aria-label="Threads">Th</a><a class="social-mini" href="https://www.instagram.com/ive.amase/" aria-label="Instagram">IG</a><a class="social-mini" href="https://x.com/amase__iv" aria-label="X">X</a><a class="head-cta" href="/demo.html">あそぶ →</a></div></header>
<main class="page">
<section class="page-hero" style="border-bottom:none;padding-bottom:10px"><p class="eyebrow">PLAY — TIMING</p><h1>止めて！タイミングバー</h1><p class="page-lead">黄色いゾーンの真ん中でバーを止めるだけ。全5ラウンド、中心に近いほど高得点。ラウンドごとに少しずつ速くなります。タップでもスペースキーでも止まります。</p></section>
<section class="section" style="border-bottom:none;padding-top:26px">
<div class="game-stage">
<div class="judge" id="judge">パーフェクト！</div>
<div class="pts-float" id="ptsFloat">+100</div>
<div class="track" id="track"><div class="zone" id="zone"></div><div class="marker" id="marker"></div></div>
<div class="hud"><span id="roundLabel">ROUND 1 / 5</span><span id="scoreLabel">SCORE 0</span><span id="bestLabel"></span></div>
<button class="button primary stop-btn" id="stopBtn" type="button">スタート</button>
<div class="result" id="resultBox" hidden><p class="rank" id="rankText"></p><p id="resultDetail" style="color:var(--ink-dim);line-height:1.9;margin:8px 0 0"></p><ul id="breakdown"></ul></div>
</div>
</section>
</main>
<footer class="site-footer"><div class="footer-brand"><img src="/amase-avatar.jpg" alt=""><span><strong>あませ</strong><br>AMASE</span></div><nav><a href="/">トップ</a><a href="/demo.html" aria-current="page">あそぶ</a><a href="/showcase.html">みる</a><a href="/notes/">よむ</a><a href="/work.html">おまけ</a><a href="https://www.threads.com/@ive.amase">Threads</a><a href="https://www.instagram.com/ive.amase/">Instagram</a><a href="https://x.com/amase__iv">X</a><a href="https://github.com/paper-daemon">GitHub</a><a href="https://amase-lab.booth.pm/">BOOTH</a></nav></footer>
<script>
const track=document.getElementById('track'),zone=document.getElementById('zone'),marker=document.getElementById('marker'),btn=document.getElementById('stopBtn');
const roundLabel=document.getElementById('roundLabel'),scoreLabel=document.getElementById('scoreLabel'),bestLabel=document.getElementById('bestLabel');
const resultBox=document.getElementById('resultBox'),rankText=document.getElementById('rankText'),resultDetail=document.getElementById('resultDetail'),breakdown=document.getElementById('breakdown');
const judge=document.getElementById('judge'),ptsFloat=document.getElementById('ptsFloat');
let round=0,score=0,playing=false,pos=0,dir=1,speed=0.16,zoneStart=40,zoneWidth=14,raf=null,last=0,history=[];
let best=Number(localStorage.getItem('timingBest')||0);
let AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(freq,dur,type,vol,when){const ac=audio();if(!ac)return;const t=ac.currentTime+(when||0);const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=freq;g.gain.setValueAtTime(vol||0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+0.02)}
function showBest(){bestLabel.textContent=best>0?`BEST ${best}`:""}
showBest();
function newZone(){zoneWidth=10+Math.random()*8;zoneStart=6+Math.random()*(88-zoneWidth);zone.style.left=zoneStart+'%';zone.style.width=zoneWidth+'%'}
function frame(t){if(!playing)return;const dt=Math.min(50,t-last);last=t;pos+=dir*speed*dt;if(pos>=98){pos=98;dir=-1;tone(240,0.05,'square',0.03)}if(pos<=0){pos=0;dir=1;tone(240,0.05,'square',0.03)}marker.style.left=`calc(${pos}% - 5px)`;raf=requestAnimationFrame(frame)}
function startRound(){round++;track.classList.remove('hit');zone.classList.remove('flash');newZone();pos=0;dir=1;speed=0.15+round*0.022;playing=true;last=performance.now();raf=requestAnimationFrame(frame);roundLabel.textContent=`ROUND ${round} / 5`;btn.textContent='とめる！'}
function showJudge(text,xPct){judge.textContent=text;judge.style.left=xPct+'%';judge.classList.remove('pop');void judge.offsetWidth;judge.classList.add('pop');ptsFloat.style.left=`calc(${xPct}% - 10px)`;ptsFloat.style.top='-6px'}
function stopRound(){playing=false;cancelAnimationFrame(raf);const center=zoneStart+zoneWidth/2;const dist=Math.abs((pos+0.5)-center);const pts=Math.max(0,Math.round(100-dist*4));score+=pts;history.push({round,pts,dist:dist.toFixed(1)});
let j;if(dist<=1.2){j='パーフェクト！';tone(880,0.12,'sine',0.14);tone(1318,0.18,'sine',0.12,0.09)}else if(dist<=zoneWidth/2){j='いい！ ゾーン内';tone(660,0.1,'sine',0.1)}else if(dist<=zoneWidth){j='おしい！';tone(330,0.12,'triangle',0.1)}else{j='はずれ…';tone(180,0.16,'triangle',0.1)}
if(dist<=zoneWidth/2){track.classList.add('hit');zone.classList.add('flash')}
showJudge(j,pos);ptsFloat.textContent='+'+pts;ptsFloat.classList.remove('pop');void ptsFloat.offsetWidth;ptsFloat.classList.add('pop');
scoreLabel.textContent=`SCORE ${score}`;if(round>=5){finish()}else{btn.textContent=`次のラウンドへ（${pts}点）`}}
function finish(){const rank=score>=430?'S — 神の指先':score>=350?'A — かなり正確':score>=250?'B — いい感じ':score>=150?'C — 練習あるのみ':'D — イヴも最初はそんな感じでした';rankText.textContent=`${score}点 / ${rank}`;
if(score>best){best=score;localStorage.setItem('timingBest',best);resultDetail.textContent='ベスト更新！ お見事でした。';tone(523,0.12,'sine',0.12);tone(659,0.12,'sine',0.12,0.1);tone(784,0.2,'sine',0.12,0.2)}else{resultDetail.textContent=`ベストは ${best} 点。もう一回やると感覚つかめます。`}
breakdown.innerHTML=history.map(h=>`<li><span>ROUND ${h.round}（中心から ${h.dist}）</span><b>${h.pts}点</b></li>`).join('');
showBest();resultBox.hidden=false;btn.textContent='もう一回遊ぶ';round=0;score=0;history=[]}
btn.addEventListener('click',()=>{audio();if(playing){stopRound()}else{resultBox.hidden=true;if(round===0)scoreLabel.textContent='SCORE 0';startRound()}});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();btn.click()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){cancelAnimationFrame(raf)}else if(!document.hidden&&playing){last=performance.now();raf=requestAnimationFrame(frame)}});
newZone();
</script>
<script src="/ad-overlay.js" defer></script>
</body></html>
