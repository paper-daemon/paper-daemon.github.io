.gcard{perspective:700px;aspect-ratio:3/4}
.gcard-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.3,1.2)}
.gcard.flip .gcard-inner{transform:rotateY(180deg)}
.gcard.slow .gcard-inner{transition-duration:1s}
.face{position:absolute;inset:0;border-radius:9px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{background:radial-gradient(120% 100% at 50% 0%,#2c3178,#12153c 70%);border:2px solid #4a539e;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:#aebaff}
.face.back .star{font-size:1.5rem;color:#ffe9a8;text-shadow:0 0 14px #ffcf4d}
.face.back .lg{font-weight:900;letter-spacing:.28em;font-size:.58rem}
.face.front{transform:rotateY(180deg);background:#0d102e;border:2.5px solid #39406e}
.face.front img{width:100%;height:100%;object-fit:cover;display:block}
.face.front .cname{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(4,6,20,.9) 45%);color:#fff;font-size:.6rem;font-weight:800;padding:13px 4px 4px;text-align:center}
.face.front .newb{position:absolute;top:5px;left:-4px;background:#ff3b6b;color:#fff;font-weight:900;font-size:.62rem;padding:3px 9px;border-radius:5px;transform:rotate(-9deg);box-shadow:0 3px 10px rgba(255,59,107,.6);display:none}
.gcard.isnew .face.front .newb{display:block}
.face.front .cntb{position:absolute;top:5px;right:5px;background:rgba(4,6,20,.82);color:#ffe9a8;font-size:.64rem;font-weight:900;border-radius:99px;padding:2px 7px;display:none}
.gcard.isdup .face.front .cntb{display:block}
.gcard[data-r="R"] .face.front{border-color:var(--r);box-shadow:0 0 14px rgba(87,182,255,.55)}
.gcard[data-r="SR"] .face.front{border-color:var(--sr);box-shadow:0 0 18px rgba(199,125,255,.75)}
.gcard[data-r="SSR"] .face.front{border-color:var(--gold);box-shadow:0 0 24px rgba(255,207,77,.9)}
.gcard.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:translate(0)}20%{transform:translate(-6px,3px) rotate(-1deg)}40%{transform:translate(6px,-3px) rotate(1deg)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,2px)}}
#flashFx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#tapHint{color:#aebaff;font-size:.78rem;font-weight:700;opacity:0;transition:opacity .3s}
/* ---- cutin ---- */
#cutin{position:absolute;inset:0;z-index:55;display:none;align-items:center;justify-content:center;background:radial-gradient(100% 100% at 50% 50%,rgba(30,10,50,.25),rgba(2,2,10,.92))}
#cutin.on{display:flex}

@keyframes spin{to{transform:rotate(360deg)}}
#cutin .big{width:min(300px,76vw);aspect-ratio:3/4;position:relative;z-index:2;animation:cutpop .6s cubic-bezier(.2,1.4,.4,1)}

#cutin .big .face.front{transform:none;border:3.5px solid transparent;background:linear-gradient(#0d102e,#0d102e) padding-box,linear-gradient(120deg,#ff5d8f,#ffcf4d,#7dffce,#57b6ff,#c77dff,#ff5d8f) border-box;background-size:100% 100%,300% 100%;animation:rbow 2.2s linear infinite}
@keyframes rbow{to{background-position:0 0,300% 0}}
#cutin .ssr-tag{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:2rem;font-weight:900;letter-spacing:.3em;color:#ffcf4d;text-shadow:0 0 22px #ff9d5c,0 2px 0 #a35b00;z-index:3}
#cutin .ssr-name{position:absolute;bottom:-40px;left:0;right:0;text-align:center;font-size:1.15rem;font-weight:900;color:#fff;text-shadow:0 2px 14px #000}
#fxCanvas{position:absolute;inset:0;z-index:54;pointer-events:none}
/* ---- results ---- */
#results{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));background:radial-gradient(120% 90% at 50% 10%,#1d2158,#070818 75%)}
#results.on{display:flex}

.res-grid{flex:1;min-height:0;width:min(560px,96vw);display:grid;grid-template-columns:repeat(5,1fr);gap:9px;align-content:center}
.res-grid.single{display:flex;justify-content:center;align-items:center}
.res-grid.single .gcard{width:min(210px,52vw)}
.res-btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.res-btns button{border:none;cursor:pointer;font-family:inherit;font-weight:900;border-radius:999px;padding:12px 24px;font-size:.95rem;color:#fff}
.rb-again{background:linear-gradient(93deg,#ff5d8f,#ff9d5c)}
.rb-dex{background:linear-gradient(93deg,#4a6bff,#8a5cff)}

@media (max-height:640px){.fan{height:150px}.fan .mini{width:82px;height:114px}.ga-title h1{font-size:1.35rem}}
</style>

<script>
(function(){
"use strict";
var CARDS = [
  {id:"n1", r:"N", name:"部屋着あませ"},
  {id:"n2", r:"N", name:"お買い物あませ"},
  {id:"n3", r:"N", name:"お料理あませ"},
  {id:"n4", r:"N", name:"ゲームあませ"},
  {id:"n5", r:"N", name:"お散歩あませ"},
  {id:"n6", r:"N", name:"寝起きあませ"},
  {id:"r1", r:"R", name:"制服あませ"},
  {id:"r2", r:"R", name:"パーカーあませ"},
  {id:"r3", r:"R", name:"カフェ店員あませ"},
  {id:"r4", r:"R", name:"ジャージあませ"},
  {id:"r5", r:"R", name:"パジャマあませ"},
  {id:"sr1", r:"SR", name:"メイドあませ"},
  {id:"sr2", r:"SR", name:"魔法少女あませ"},
  {id:"sr3", r:"SR", name:"チャイナあませ"},
  {id:"sr4", r:"SR", name:"バニーあませ"},
  {id:"ssr1", r:"SSR", name:"ステージのあませ"},
  {id:"ssr2", r:"SSR", name:"花嫁あませ"},
  {id:"ssr3", r:"SSR", name:"振袖あませ"}
];
var RANK = {N:0, R:1, SR:2, SSR:3};
var BYID = {}; CARDS.forEach(function(c){ BYID[c.id] = c; });
var IMG = function(id){ return "/play/assets/gacha-preview/" + id + ".jpg"; };
CARDS.forEach(function(c){ var i = new Image(); i.src = IMG(c.id); });

/* ---------- save ---------- */
var KEY = "amaseGacha.v1", save;
try { save = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ save = null; }
if (!save || typeof save !== "object") save = {counts:{}, total:0, muted:false};
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(save)); } catch(e){} }
function ownCount(){ var n = 0; CARDS.forEach(function(c){ if ((save.counts[c.id]||0) > 0) n++; }); return n; }

/* ---------- sound (WebAudio synth) ---------- */
var AC = null, master = null;
function audio(){
  if (AC) { if (AC.state === "suspended") AC.resume(); return AC; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = save.muted ? 0 : 0.5; master.connect(AC.destination);
  } catch(e){ AC = null; }
  return AC;
}
function tone(f, delay, dur, type, vol, slide){
  if (!audio() || save.muted) return;
  var t = AC.currentTime + (delay||0);
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol || .2, t + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05);
}
function noiseBurst(delay, dur, vol, freq){
  if (!audio() || save.muted) return;
  var t = AC.currentTime + (delay||0);
  var len = Math.max(1, (dur * AC.sampleRate)|0);
  var buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  var src = AC.createBufferSource(); src.buffer = buf;
  var f = AC.createBiquadFilter(); f.type = "highpass"; f.frequency.value = freq || 1800;
  var g = AC.createGain(); g.gain.value = vol || .15;
  src.connect(f); f.connect(g); g.connect(master); src.start(t);
}
var LADDER = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.51, 1567.98, 1760.0];
var SE = {
  tap: function(){ tone(660, 0, .07, "triangle", .12); },
  sweep: function(big){ tone(big ? 130 : 180, 0, big ? 1.1 : .8, "sawtooth", .07, big ? 980 : 720); noiseBurst(.1, .5, .05, 900); },
  flip: function(i){ noiseBurst(0, .09, .16, 2400); tone(LADDER[Math.min(i, LADDER.length-1)], .02, .34, "triangle", .16); },
  stingR: function(){ tone(880, 0, .2, "sine", .14); tone(1318.5, .07, .3, "sine", .13); },
  stingSR: function(){ [1046.5, 1318.5, 1568, 2093].forEach(function(f, i){ tone(f, i*.07, .4, "triangle", .15); }); noiseBurst(.05, .3, .07, 3200); },
  fanfare: function(){ [523.25, 659.25, 783.99, 1046.5].forEach(function(f, i){ tone(f, i*.09, .7, "square", .07); tone(f*2, i*.09, .5, "sine", .1); }); [1318.5, 1568, 2093].forEach(function(f, i){ tone(f, .4 + i*.08, .6, "triangle", .13); }); noiseBurst(.1, .7, .06, 4000); },
  pop: function(){ noiseBurst(0, .18, .2, 1200); tone(392, 0, .12, "square", .08, 180); }
};

/* ---------- confetti ---------- */
var fx = document.getElementById("fxCanvas"), fctx = fx.getContext("2d"), parts = [], fxRun = false;
function fxSize(){ fx.width = innerWidth; fx.height = innerHeight; }
addEventListener("resize", fxSize); fxSize();
function confetti(n, cx, cy){
  var cols = ["#ff5d8f","#ffcf4d","#7dffce","#57b6ff","#c77dff","#ffffff"];
  for (var i = 0; i < n; i++){
    parts.push({x: cx != null ? cx : innerWidth/2, y: cy != null ? cy : innerHeight*.42,
      vx: (Math.random()-.5)*11, vy: -(4 + Math.random()*8), g: .28 + Math.random()*.12,
      s: 4 + Math.random()*6, rot: Math.random()*6.28, vr: (Math.random()-.5)*.35,
      c: cols[(Math.random()*cols.length)|0], life: 70 + Math.random()*50});
  }
  if (!fxRun){ fxRun = true; fxTick(); }
}
function fxTick(){
  fctx.clearRect(0, 0, fx.width, fx.height);
  parts = parts.filter(function(p){ return p.life > 0; });
  parts.forEach(function(p){
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .99; p.rot += p.vr; p.life--;
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.rot);
    fctx.globalAlpha = Math.min(1, p.life/30); fctx.fillStyle = p.c;
    fctx.fillRect(-p.s/2, -p.s/2, p.s, p.s*.62); fctx.restore();
  });
  if (parts.length){ requestAnimationFrame(fxTick); } else { fxRun = false; fctx.clearRect(0,0,fx.width,fx.height); }
}

/* ---------- dom refs ---------- */
function el(id){ return document.getElementById(id); }
var viewHome = el("viewHome"), viewDex = el("viewDex"), overlay = el("overlay"),
    darkness = el("darkness"), beamWrap = el("beamWrap"), beam = el("beam"),
    stageCards = el("stageCards"), revealGrid = el("revealGrid"), tapHint = el("tapHint"),
    cutin = el("cutin"), cutinCard = el("cutinCard"), results = el("results"),
    resGrid = el("resGrid"), resTitle = el("resTitle"), flashFx = el("flashFx"),
    skipBtn = el("skipBtn");

function showView(v){
  viewHome.classList.toggle("on", v === "home");
  viewDex.classList.toggle("on", v === "dex");
  if (v === "dex") renderDex();
  updateStats();
}
function updateStats(){
  var own = ownCount();
  el("homeStats").innerHTML = "コンプ率 <b>" + Math.round(own / CARDS.length * 100) + "%</b>（" + own + " / " + CARDS.length + "種）・通算 <b>" + save.total + "</b> 連";
}

/* ---------- gacha logic ---------- */
function rollRarity(guaranteed){
  var x = Math.random();
  if (guaranteed) return x < .12 ? "SSR" : "SR";
  if (x < .03) return "SSR";
  if (x < .13) return "SR";
  if (x < .40) return "R";
  return "N";
}
function rollPull(n){
  var out = [];
  for (var i = 0; i < n; i++){
    var r = rollRarity(n === 10 && i === n - 1);
    var pool = CARDS.filter(function(c){ return c.r === r; });
    out.push(pool[(Math.random()*pool.length)|0]);
  }
  return out;
}

/* ---------- show sequencing ---------- */
var skipFlag = false, hurryFlag = false, showBusy = false;
function wait(ms){
  return new Promise(function(res){
    var t0 = Date.now();
    (function chk(){
      if (skipFlag) return res("skip");
      if (hurryFlag){ hurryFlag = false; return res("hurry"); }
      if (Date.now() - t0 >= ms) return res("done");
      setTimeout(chk, 40);
    })();
  });
}
overlay.addEventListener("pointerdown", function(){
  if (showBusy && !results.classList.contains("on")) hurryFlag = true;
});
skipBtn.addEventListener("click", function(e){ e.stopPropagation(); skipFlag = true; });

function cardEl(card, opts){
  opts = opts || {};
  var d = document.createElement("div");
  d.className = "gcard" + (opts.isNew ? " isnew" : "") + (opts.dupCount ? " isdup" : "");
  d.setAttribute("data-r", card.r);
  d.innerHTML = '<div class="gcard-inner">' +
    '<div class="face back"><div class="star">★</div><div class="lg">AMASE</div></div>' +
    '<div class="face front"><img src="' + IMG(card.id) + '" alt="">' +
    '<span class="newb">NEW!</span>' +
    (opts.dupCount ? '<span class="cntb">×' + opts.dupCount + '</span>' : '') +
    '<div class="cname">' + card.r + "「" + card.name + "」</div></div></div>";
  return d;
}
function flash(op){
  flashFx.style.transition = "none"; flashFx.style.opacity = op;
  requestAnimationFrame(function(){ flashFx.style.transition = "opacity .45s"; flashFx.style.opacity = 0; });
}
function maxRank(list){ return list.reduce(function(m, c){ return Math.max(m, RANK[c.r]); }, 0); }

async function runShow(pulled, preCounts){
  showBusy = true; skipFlag = false; hurryFlag = false;
  overlay.classList.add("on"); overlay.setAttribute("aria-hidden", "false");
  results.classList.remove("on"); cutin.classList.remove("on");
  stageCards.classList.remove("on"); skipBtn.style.display = "";
  var maxR = maxRank(pulled);
  /* phase A: darkness + beam */
  darkness.style.opacity = 1; beamWrap.style.opacity = 1;
  beam.className = "beam";
  var beamColor = ["#ffffff", "#57b6ff", "#c77dff", "#ffcf4d"][maxR];
  beam.style.setProperty("--beam", beamColor);
  beam.style.setProperty("--beamGlow", ["rgba(255,255,255,.45)", "rgba(87,182,255,.5)", "rgba(199,125,255,.55)", "rgba(255,207,77,.6)"][maxR]);
  if (maxR === 3) beam.classList.add("beam-rainbow");
  SE.sweep(maxR >= 2);
  await wait(120); beam.classList.add("up");
  var beamWait = await wait(maxR === 3 ? 1250 : maxR === 2 ? 1000 : 750);
  /* phase B: reveals, ascending rarity so the best comes last */
  var order = pulled.map(function(c, i){ return {c: c, i: i}; })
    .sort(function(a, b){ return RANK[a.c.r] - RANK[b.c.r] || a.i - b.i; });
  revealGrid.className = "reveal-grid" + (pulled.length === 1 ? " single" : "");
  revealGrid.innerHTML = "";
  var els = {};
  order.forEach(function(o){ var e = cardEl(o.c, {}); els[o.i] = e; revealGrid.appendChild(e); });
  beamWrap.style.opacity = 0; darkness.style.opacity = .55;
  stageCards.classList.add("on"); tapHint.style.opacity = 1;
  if (beamWait !== "skip"){
    for (var k = 0; k < order.length; k++){
      if (skipFlag) break;
      var item = order[k], card = item.c, e2 = els[item.i];
      if (card.r === "SSR"){
        tapHint.style.opacity = 0;
        var w = await showCutin(card, preCounts[card.id] === 0);
        if (w === "skip"){ skipFlag = true; break; }
        e2.classList.add("flip");
        await wait(320);
      } else {
        if (RANK[card.r] >= 2){ var wp = await wait(300); if (wp === "skip") break; }
        SE.flip(k);
        e2.classList.add("flip");
        if (card.r === "SR"){
          flash(.75); e2.classList.add("shake"); SE.stingSR();
          confetti(26);
          var wq = await wait(620); if (wq === "skip") break;
        } else if (card.r === "R"){
          SE.stingR();
          var wr = await wait(430); if (wr === "skip") break;
        } else {
          var wn = await wait(400); if (wn === "skip") break;
        }
      }
    }
  }
  /* phase C: results */
  showResults(pulled, preCounts);
  showBusy = false;
}
async function showCutin(card, isNew){
  cutinCard.innerHTML = '<div class="ssr-tag">SSR</div>' +
    '<div class="face front" style="position:relative;width:100%;height:100%">' +
    '<img src="' + IMG(card.id) + '" alt="">' +
    (isNew ? '<span class="newb" style="display:block;position:absolute;top:8px;left:-4px;background:#ff3b6b;color:#fff;font-weight:900;font-size:.8rem;padding:4px 12px;border-radius:6px;transform:rotate(-9deg)">NEW!</span>' : '') +
    '<div class="cname" style="font-size:.85rem">「' + card.name + '」</div></div>' +
    '<div class="ssr-name">✦ ' + card.name + ' ✦</div>';
  cutin.classList.add("on");
  SE.pop(); flash(.9);
  await wait(260);
  SE.fanfare(); confetti(90);
  document.querySelector(".ga-full").animate(
    [{transform:"translate(0)"},{transform:"translate(-7px,4px)"},{transform:"translate(7px,-4px)"},{transform:"translate(-4px,-3px)"},{transform:"translate(0)"}],
    {duration:420, iterations:1});
  var w = await wait(1500);
  cutin.classList.remove("on");
  return w;
}
function showResults(pulled, preCounts){
  stageCards.classList.remove("on"); cutin.classList.remove("on");
  beamWrap.style.opacity = 0; darkness.style.opacity = 0;
  skipBtn.style.display = "none";
  resGrid.className = "res-grid" + (pulled.length === 1 ? " single" : "");
  resGrid.innerHTML = "";
  var newN = 0, seenPull = {};
  pulled.forEach(function(c){
    var isNew = preCounts[c.id] === 0 && !seenPull[c.id];
    seenPull[c.id] = true;
    if (isNew) newN++;
    var total = save.counts[c.id] || 0;
    var e = cardEl(c, {isNew: isNew, dupCount: (!isNew && total > 1) ? total : 0});
    e.classList.add("flip"); resGrid.appendChild(e);
  });
  var maxR = maxRank(pulled);
  resTitle.textContent = maxR === 3 ? "🎉 SSRキターー！！ 🎉" : maxR === 2 ? "✨ SR出た！ ✨" : newN > 0 ? "結果（NEW " + newN + "枚！）" : "結果";
  results.classList.add("on");
  if (maxR === 3) confetti(70);
  updateStats();
}
function closeOverlay(){
  overlay.classList.remove("on"); overlay.setAttribute("aria-hidden", "true");
  results.classList.remove("on"); stageCards.classList.remove("on"); cutin.classList.remove("on");
}

var lastPullN = 1;
function doPull(n){
  if (showBusy) return;
  audio(); SE.tap();
  lastPullN = n;
  var pulled = rollPull(n);
  var pre = {};
  pulled.forEach(function(c){ pre[c.id] = save.counts[c.id] || 0; });
  pulled.forEach(function(c){ save.counts[c.id] = (save.counts[c.id] || 0) + 1; });
  save.total += n; persist(); updateStats();
  runShow(pulled, pre);
}

/* ---------- dex ---------- */
function renderDex(){
  var grid = el("dexGrid"); grid.innerHTML = "";
  var sorted = CARDS.slice().sort(function(a, b){ return RANK[b.r] - RANK[a.r]; });
  sorted.forEach(function(c){
    var n = save.counts[c.id] || 0;
    var d = document.createElement("div");
    d.className = "dex-cell r-" + c.r + (n ? "" : " unowned");
    d.innerHTML = '<img src="' + IMG(c.id) + '" alt="" loading="lazy">' +
      '<span class="rt rt-' + c.r + '">' + c.r + '</span>' +
      (n > 1 ? '<span class="ct">×' + n + '</span>' : '') +
      '<div class="nm">' + (n ? c.name : "？？？") + '</div>';
    grid.appendChild(d);
  });
  var own = ownCount();
  el("dexBar").style.width = (own / CARDS.length * 100) + "%";
  var per = {};
  CARDS.forEach(function(c){ per[c.r] = per[c.r] || {o:0, t:0}; per[c.r].t++; if ((save.counts[c.id]||0) > 0) per[c.r].o++; });
  el("dexMeta").textContent = "コンプ率 " + Math.round(own / CARDS.length * 100) + "%（" + own + " / " + CARDS.length + "）　SSR " + per.SSR.o + "/" + per.SSR.t + " ・ SR " + per.SR.o + "/" + per.SR.t + " ・ R " + per.R.o + "/" + per.R.t + " ・ N " + per.N.o + "/" + per.N.t;
}

/* ---------- wiring ---------- */
el("pull1").addEventListener("click", function(){ doPull(1); });
el("pull10").addEventListener("click", function(){ doPull(10); });
el("openDex").addEventListener("click", function(){ audio(); SE.tap(); showView("dex"); });
el("dexBack").addEventListener("click", function(){ SE.tap(); showView("home"); });
el("resAgain").addEventListener("click", function(){ closeOverlay(); doPull(lastPullN); });
el("resDex").addEventListener("click", function(){ closeOverlay(); showView("dex"); });
el("resHome").addEventListener("click", function(){ closeOverlay(); showView("home"); });
var soundBtn = el("soundBtn");
function syncSound(){ soundBtn.textContent = save.muted ? "🔇 音なし" : "🔊 音あり"; if (master) master.gain.value = save.muted ? 0 : .5; }
soundBtn.addEventListener("click", function(){ save.muted = !save.muted; persist(); syncSound(); if (!save.muted){ audio(); SE.tap(); } });
var st = document.getElementById("gaFull");
st.addEventListener("contextmenu", function(e){ e.preventDefault(); });
st.addEventListener("selectstart", function(e){ e.preventDefault(); });
st.addEventListener("dragstart", function(e){ e.preventDefault(); });
overlay.addEventListener("contextmenu", function(e){ e.preventDefault(); });
syncSound(); updateStats();
})();
</script>
